<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Controller Body Gradient -->
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Star Gold Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- ABC Blocks Gradients -->
    <linearGradient id="redBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="greenBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="yellowBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- Puzzle Pieces Gradients -->
    <linearGradient id="bluePuzzle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="purplePuzzle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0369A1" flood-opacity="0.35"/>
    </filter>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#EAB308" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Floating Educational ABC Blocks (Top Left) -->
  <g transform="translate(60, 45)">
    <!-- Block A -->
    <rect x="30" y="20" width="54" height="54" rx="14" fill="url(#redBlock)" filter="url(#dropShadow)"/>
    <text x="57" y="58" font-family="'Fredoka', 'Outfit', sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" text-anchor="middle">A</text>
    
    <!-- Block B -->
    <rect x="94" y="38" width="50" height="50" rx="12" fill="url(#greenBlock)" filter="url(#dropShadow)"/>
    <text x="119" y="74" font-family="'Fredoka', 'Outfit', sans-serif" font-weight="800" font-size="30" fill="#FFFFFF" text-anchor="middle">B</text>

    <!-- Block C -->
    <rect x="0" y="82" width="48" height="48" rx="12" fill="url(#yellowBlock)" filter="url(#dropShadow)"/>
    <text x="24" y="116" font-family="'Fredoka', 'Outfit', sans-serif" font-weight="800" font-size="28" fill="#78350F" text-anchor="middle">C</text>
  </g>

  <!-- Floating Puzzle Pieces (Top Right) -->
  <g transform="translate(320, 50)" filter="url(#dropShadow)">
    <!-- Blue Puzzle -->
    <path d="M 20 20 H 60 V 35 Q 75 35 75 50 Q 75 65 60 65 V 80 H 20 V 20 Z" fill="url(#bluePuzzle)" rx="8"/>
    <!-- Purple Puzzle -->
    <path d="M 75 30 H 125 V 70 H 75 Z" fill="url(#purplePuzzle)" rx="8" transform="rotate(15 100 50)"/>
  </g>

  <!-- Main Game Controller (Center) -->
  <g filter="url(#dropShadow)">
    <!-- Main Controller Shell -->
    <path d="M 120 220 
             C 120 180, 180 170, 256 170 
             C 332 170, 392 180, 392 220 
             C 412 250, 442 370, 400 420 
             C 362 465, 310 440, 280 370 
             C 265 335, 247 335, 232 370 
             C 202 440, 150 465, 112 420 
             C 70 370, 100 250, 120 220 Z" 
          fill="url(#ctrlGrad)" stroke="#FFFFFF" stroke-width="8"/>

    <!-- Left D-Pad -->
    <g transform="translate(150, 260)">
      <path d="M 24 0 H 48 V 24 H 72 V 48 H 48 V 72 H 24 V 48 H 0 V 24 H 24 Z" fill="#0369A1"/>
      <circle cx="36" cy="36" r="8" fill="#E0F2FE"/>
    </g>

    <!-- Right Action Buttons -->
    <g transform="translate(290, 260)">
      <circle cx="36" cy="10" r="14" fill="#EF4444"/> <!-- Red Y -->
      <circle cx="62" cy="36" r="14" fill="#22C55E"/> <!-- Green B -->
      <circle cx="10" cy="36" r="14" fill="#FACC15"/> <!-- Yellow X -->
      <circle cx="36" cy="62" r="14" fill="#3B82F6"/> <!-- Blue A -->
      <text x="36" y="16" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFF" text-anchor="middle">Y</text>
      <text x="62" y="42" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFF" text-anchor="middle">B</text>
      <text x="10" y="42" font-family="sans-serif" font-weight="900" font-size="14" fill="#78350F" text-anchor="middle">X</text>
      <text x="36" y="68" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFF" text-anchor="middle">A</text>
    </g>

    <!-- Cheerful Eyes & Smile on Controller -->
    <!-- Left Eye -->
    <ellipse cx="205" cy="245" rx="8" ry="12" fill="#0C4A6E"/>
    <circle cx="202" cy="241" r="3" fill="#FFFFFF"/>
    <!-- Right Eye -->
    <ellipse cx="307" cy="245" rx="8" ry="12" fill="#0C4A6E"/>
    <circle cx="304" cy="241" r="3" fill="#FFFFFF"/>
    <!-- Cheeks -->
    <ellipse cx="190" cy="260" rx="10" ry="6" fill="#F43F5E" opacity="0.6"/>
    <ellipse cx="322" cy="260" rx="10" ry="6" fill="#F43F5E" opacity="0.6"/>
    <!-- Smile -->
    <path d="M 236 265 Q 256 282 276 265" fill="none" stroke="#0C4A6E" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Glowing Golden Star Badge (Bottom Center) -->
  <g transform="translate(256, 375) scale(1.15)" filter="url(#starGlow)">
    <path d="M 0 -45 L 13 -14 L 45 -11 L 20 10 L 28 41 L 0 23 L -28 41 L -20 10 L -45 -11 L -13 -14 Z" 
          fill="url(#starGrad)" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Star Smile -->
    <circle cx="-10" cy="-6" r="4" fill="#78350F"/>
    <circle cx="10" cy="-6" r="4" fill="#78350F"/>
    <path d="M -10 6 Q 0 16 10 6" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
