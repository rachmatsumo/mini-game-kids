<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Vibrant Sunset Sunshine to Coral Amber -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="50%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#FF5964"/>
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Inner Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3A1C00" flood-opacity="0.28"/>
    </filter>

    <!-- Star Glow -->
    <filter id="starGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FFE600" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Main Container Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#mainBg)" filter="url(#softShadow)"/>
  
  <!-- Outer Gold/White Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-opacity="0.6"/>

  <!-- Top Glass Highlight overlay -->
  <path d="M 32 136 C 32 80 80 32 136 32 L 376 32 C 432 32 480 80 480 136 Q 256 220 32 136 Z" fill="url(#gloss)"/>

  <!-- Cheerful Playful Emblem: Controller + Smiling Star -->
  <g transform="translate(0, 10)">
    <!-- Game Controller Body -->
    <rect x="96" y="180" width="320" height="196" rx="80" fill="#FFFFFF" filter="url(#softShadow)"/>
    <rect x="108" y="192" width="296" height="172" rx="68" fill="#F8FAFC"/>

    <!-- Left D-Pad (Sky Blue) -->
    <g transform="translate(148, 240)">
      <path d="M 24 0 H 48 V 24 H 72 V 48 H 48 V 72 H 24 V 48 H 0 V 24 H 24 Z" fill="#0284C7" rx="8"/>
      <circle cx="36" cy="36" r="8" fill="#E0F2FE"/>
    </g>

    <!-- Right Action Buttons (Vibrant Colors) -->
    <g transform="translate(292, 240)">
      <circle cx="36" cy="12" r="14" fill="#EF4444"/> <!-- Red Y -->
      <circle cx="60" cy="36" r="14" fill="#10B981"/> <!-- Green B -->
      <circle cx="12" cy="36" r="14" fill="#F59E0B"/> <!-- Amber X -->
      <circle cx="36" cy="60" r="14" fill="#3B82F6"/> <!-- Blue A -->
    </g>

    <!-- Center Smiling Star Emblem (Cheerful Mascot Accent) -->
    <g transform="translate(256, 175) scale(0.95)" filter="url(#starGlow)">
      <!-- Star shape -->
      <path d="M 0 -55 L 15 -18 L 54 -14 L 24 12 L 33 50 L 0 28 L -33 50 L -24 12 L -54 -14 L -15 -18 Z" fill="#FFD166" stroke="#FFFFFF" stroke-width="6"/>
      <!-- Eyes -->
      <circle cx="-12" cy="-8" r="5" fill="#3A1C00"/>
      <circle cx="12" cy="-8" r="5" fill="#3A1C00"/>
      <!-- Smile -->
      <path d="M -12 6 Q 0 18 12 6" fill="none" stroke="#3A1C00" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
