<style>
  :root{
    --bg-top:#FFEDD8;
    --bg-bottom:#D9F4F0;
    --ink:#3A2B22;
    --dim:#8A7566;
    --panel-bg:rgba(255,255,255,.62);
    --coral:#FF6F59;
    --yellow:#FFC857;
    --teal:#3FBFAE;
    --purple:#8B7FD1;
    --font-display:'Fredoka', sans-serif;
    --font-body:'Nunito', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden;
    background:linear-gradient(165deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    font-family:var(--font-body); color:var(--ink);}
  #stage{position:relative; width:100%; height:100vh; min-height:560px; display:flex; flex-direction:column; overflow:hidden;}
  [hidden]{display:none !important;}

  #musicToggle{
    position:absolute; top:14px; right:14px; z-index:30;
    width:40px; height:40px; border-radius:50%;
    background:rgba(58,43,34,.08); border:1px solid rgba(58,43,34,.14);
    color:var(--ink); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, background .15s ease;
  }
  #musicToggle:hover{ background:rgba(58,43,34,.16); }
  #musicToggle:active{ transform:scale(.9); }
  #musicToggle.on{ background:linear-gradient(135deg, var(--teal), #2A9C8D); color:#0B2F29; border-color:transparent; }

  /* ---------- MENU ---------- */
  #menuScreen{position:relative; z-index:2; flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px; gap:20px;}
  #menuScreen > *{ animation:menuIn .6s cubic-bezier(.22,.9,.32,1.1) both; }
  #menuScreen > *:nth-child(1){ animation-delay:.05s; }
  #menuScreen > *:nth-child(2){ animation-delay:.16s; }
  #menuScreen > *:nth-child(3){ animation-delay:.27s; }
  #menuScreen > *:nth-child(4){ animation-delay:.38s; }
  @keyframes menuIn{0%{opacity:0; transform:translateY(20px) scale(.97);} 100%{opacity:1; transform:translateY(0) scale(1);}}

  .mascot{position:absolute; top:6%; left:8%; font-size:38px; pointer-events:none;
    animation:bob 4.2s ease-in-out infinite, menuIn .6s ease .5s both;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg);} 50%{transform:translateY(-12px) rotate(6deg);}}

  .kicker{font-family:var(--font-body); font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    font-size:12px; color:#C2492F;}
  h1{font-family:var(--font-display); font-weight:700; font-size:clamp(28px,6vw,44px); margin:6px 0 0; color:var(--ink);}
  .subtitle{color:var(--dim); font-size:15px; max-width:400px; margin:6px auto 0; font-weight:700;}

  .panel{background:var(--panel-bg); border:1px solid rgba(58,43,34,.08); border-radius:20px;
    padding:18px 20px; width:min(92vw,420px); backdrop-filter:blur(6px);
    box-shadow:0 10px 26px rgba(58,43,34,.08);}
  .panel h2{font-family:var(--font-display); font-size:13px; font-weight:600; margin:0 0 12px;
    color:var(--dim); text-transform:uppercase; letter-spacing:.08em; text-align:left;}
  .level-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .level-btn{position:relative; font-family:var(--font-body); font-weight:800; font-size:14px; color:var(--ink);
    background:rgba(255,255,255,.7); border:2px solid rgba(58,43,34,.1); border-radius:14px;
    padding:12px 6px; cursor:pointer; transition:all .15s ease;}
  .level-btn small{display:block; font-weight:700; color:var(--dim); font-size:11px; margin-top:3px;}
  .level-btn:hover{border-color:var(--teal); transform:translateY(-1px);}
  .level-btn.active{background:linear-gradient(135deg, var(--teal), #2A9C8D); color:#0B2F29; border-color:transparent;
    box-shadow:0 6px 18px rgba(63,191,174,.35);}
  .level-btn.active small{color:#0B2F29;}
  .level-btn.level-done::after{
    content:'✓'; position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--coral); color:#fff; font-size:11px; font-weight:800; display:flex;
    align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.2);
  }

  #startBtn{font-family:var(--font-display); font-weight:600; font-size:18px; color:#3A2400;
    background:linear-gradient(135deg, var(--yellow), #F0A93A); border:none; border-radius:999px;
    padding:14px 40px; cursor:pointer; box-shadow:0 10px 26px rgba(255,200,87,.4); transition:transform .15s ease;}
  #startBtn:hover{transform:translateY(-2px) scale(1.02);}
  #startBtn:active{transform:translateY(0) scale(.98);}

  /* ---------- GAME ---------- */
  #gameScreen{position:relative; z-index:2; flex:1; display:none; flex-direction:column; min-height:0;}
  #topbar{display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:12px 60px 8px 16px; font-family:var(--font-body); font-weight:800; font-size:13px;
    color:var(--dim); flex-wrap:wrap;}
  #backBtn{background:rgba(58,43,34,.08); border:none; color:var(--ink); font-weight:800;
    border-radius:999px; padding:6px 14px; cursor:pointer; font-family:var(--font-body); font-size:12px;}
  .stat{background:rgba(255,255,255,.65); border-radius:999px; padding:6px 14px;}
  .stat b{color:var(--ink);}

  #soundArea{display:flex; flex-direction:column; align-items:center; gap:10px; padding:8px 16px 4px;}
  #speakerBtn{
    width:104px; height:104px; border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #FFDDA8, var(--yellow));
    box-shadow:0 12px 26px rgba(255,200,87,.4);
    font-size:42px; display:flex; align-items:center; justify-content:center;
    position:relative; transition:transform .15s ease;
  }
  #speakerBtn:active{ transform:scale(.94); }
  #speakerBtn .ring{
    position:absolute; inset:-10px; border-radius:50%; border:3px solid rgba(255,200,87,.6);
    opacity:0; pointer-events:none;
  }
  #speakerBtn.playing .ring{ animation:ringPulse 1s ease-out; }
  @keyframes ringPulse{
    0%{ opacity:.9; transform:scale(.85); }
    100%{ opacity:0; transform:scale(1.35); }
  }
  .replay-label{font-weight:800; font-size:13px; color:var(--dim);}

  #choicesGrid{display:grid; gap:14px; padding:14px 20px 20px; flex:1; align-content:center;
    width:min(92vw,440px); margin:0 auto;}
  .choice-btn{
    border:none; border-radius:20px; cursor:pointer; font-size:clamp(34px,9vw,48px);
    background:rgba(255,255,255,.75); box-shadow:0 8px 18px rgba(58,43,34,.14);
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease;
  }
  .choice-btn:active{ transform:scale(.94); }
  .choice-btn.correct{ background:linear-gradient(155deg, #C9F2D6, #8FE0A8); box-shadow:0 0 0 3px var(--teal), 0 10px 20px rgba(63,191,174,.35); animation:correctPulse .5s ease; }
  .choice-btn.wrong{ background:linear-gradient(155deg, #FFD3CB, #FFAFA0); animation:shakeChoice .4s ease; }
  @keyframes correctPulse{0%{transform:scale(1);} 40%{transform:scale(1.1);} 100%{transform:scale(1);}}
  @keyframes shakeChoice{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}

  /* ---------- FINISH ---------- */
  #finishScreen{position:relative; z-index:2; flex:1; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; text-align:center; padding:24px;}
  .btn-row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  .secondary-btn{font-family:var(--font-body); font-weight:800; font-size:14px; color:var(--ink);
    background:rgba(255,255,255,.7); border:2px solid rgba(58,43,34,.12); border-radius:999px;
    padding:12px 26px; cursor:pointer;}
  .score-big{font-family:var(--font-display); font-size:44px; font-weight:700; color:#C2492F;}

  @media (prefers-reduced-motion: reduce){
    .mascot{animation:none;}
    #menuScreen > *{animation:menuIn .01s linear both;}
    #speakerBtn.playing .ring{animation:none;}
  }

  .mascot-icon {
    font-size: 32px;
    width: 60px;
    height: 60px;
    border-radius: 20px;
    background: linear-gradient(135deg, #FFC93C, #FF9F1C);
    border: 3px solid #FFF;
    box-shadow: 0 8px 20px rgba(255, 159, 28, 0.4);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #3A2400;
    animation: mascotFloat 3s ease-in-out infinite;
  }
  @keyframes mascotFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }


  .mascot-img-wrap {
    width: 84px;
    height: 84px;
    border-radius: 24px;
    border: 4px solid #FFC93C;
    box-shadow: 0 10px 25px rgba(255, 201, 60, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.6);
    overflow: hidden;
    background: #FFF;
    display: inline-block;
    margin-bottom: 8px;
    animation: mascotFloat 3s ease-in-out infinite;
  }
  .mascot-3d-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  @keyframes mascotFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

</style>

<body>
<div id="stage">
  <button id="musicToggle" aria-label="Musik latar"><i class="bi bi-volume-mute-fill"></i></button>

  <!-- MENU -->
  <div id="menuScreen">
    <div class="mascot-img-wrap"><img src="../assets/img/game-thumbnail/app-sound.png" alt="Game Mascot" class="mascot-3d-img"></div>
    <div class="title-wrap">
      <span class="kicker">Latihan Mendengar</span>
      <h1><i class="bi bi-volume-up-fill" style="color:#FFC93C"></i> Tebak Suara Hewan</h1>

  <!-- GAME -->
  <div id="gameScreen">
    <div id="topbar">

      <button class="secondary-btn" id="nextLevelBtn" hidden style="background:linear-gradient(135deg,var(--yellow),#F0A93A); color:#3A2400; border:none;">Lanjut Level Berikutnya <i class="bi bi-arrow-right-short"></i></button>
    </div>
    <div class="btn-row">
      <button class="secondary-btn" id="restartBtn">🔁 Ulangi Level Ini</button>
      <button class="secondary-btn" id="menuBtn2" style="background:linear-gradient(135deg,var(--teal),#2A9C8D); color:#0B2F29; border:none;">🏠 Menu Utama</button>
    </div>
  </div>
</div>

<script>

function submitPortalScore(gameKey, score) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'MAINEDU_SUBMIT_SCORE',
        gameKey: gameKey,
        score: Number(score) || 0
      }, '*');
    }
  } catch(e) {}
}

const CURRENT_GAME_KEY = "sound";
(function(){
  const LEVELS = {
    mudah:  { label:'Mudah',  sub:'3 pilihan', choices:3, rounds:4 },
    sedang: { label:'Sedang', sub:'4 pilihan', choices:4, rounds:6 },
    sulit:  { label:'Sulit',  sub:'5 pilihan', choices:5, rounds:8 },
  };
  const LEVEL_ORDER = ['mudah', 'sedang', 'sulit'];

  const ANIMALS = [
    { emoji:'🐶', name:'Anjing', sound:'Guk guk guk!', tone:[{f:180,d:.09,t:'square'},{f:0,d:.05},{f:180,d:.09,t:'square'},{f:0,d:.05},{f:180,d:.12,t:'square'}] },
    { emoji:'🐱', name:'Kucing', sound:'Meoong', tone:[{f:500,fe:750,d:.28,t:'sine'},{f:0,d:.06},{f:750,fe:500,d:.22,t:'sine'}] },
    { emoji:'🐄', name:'Sapi',   sound:'Mooo', tone:[{f:130,fe:100,d:.55,t:'sawtooth'}] },
    { emoji:'🐔', name:'Ayam',   sound:'Kukuruyuk!', tone:[{f:500,d:.08,t:'square'},{f:650,d:.08,t:'square'},{f:800,d:.08,t:'square'},{f:1000,d:.16,t:'square'}] },
    { emoji:'🦆', name:'Bebek',  sound:'Kwek kwek!', tone:[{f:320,d:.1,t:'sawtooth'},{f:0,d:.05},{f:300,d:.1,t:'sawtooth'}] },
    { emoji:'🐐', name:'Kambing',sound:'Mbeek!', tone:[{f:330,fe:300,d:.16,t:'sawtooth'},{f:0,d:.04},{f:340,fe:300,d:.2,t:'sawtooth'}] },
    { emoji:'🐑', name:'Domba',  sound:'Baaa~', tone:[{f:300,fe:280,d:.5,t:'sawtooth'}] },
    { emoji:'🐦', name:'Burung', sound:'Cit cuit, cit cuit!', tone:[{f:1300,d:.06,t:'sine'},{f:1500,d:.06,t:'sine'},{f:0,d:.05},{f:1300,d:.06,t:'sine'},{f:1500,d:.06,t:'sine'}] },
    { emoji:'🐸', name:'Katak',  sound:'Kroak kroak!', tone:[{f:160,d:.1,t:'square'},{f:0,d:.05},{f:150,d:.14,t:'square'}] },
    { emoji:'🐷', name:'Babi',   sound:'Oink oink!', tone:[{f:260,fe:220,d:.12,t:'square'},{f:0,d:.05},{f:250,fe:210,d:.12,t:'square'}] },
    { emoji:'🦁', name:'Singa',  sound:'Auuum!', tone:[{f:110,fe:200,d:.35,t:'sawtooth'},{f:180,fe:100,d:.3,t:'sawtooth'}] },
    { emoji:'🐒', name:'Monyet', sound:'Uu uu aa aa!', tone:[{f:700,d:.07,t:'triangle'},{f:750,d:.07,t:'triangle'},{f:0,d:.04},{f:700,d:.07,t:'triangle'},{f:750,d:.07,t:'triangle'}] },
  ];
  const PRAISE = ['Hebat!', 'Pintar!', 'Betul!', 'Keren!', 'Asyik!'];

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const finishScreen = document.getElementById('finishScreen');
  const levelGrid = document.getElementById('levelGrid');
  const choicesGrid = document.getElementById('choicesGrid');
  const speakerBtn = document.getElementById('speakerBtn');

  let state = {
    levelKey: 'mudah',
    roundIdx: 0,
    totalRounds: 4,
    correctCount: 0,
    moves: 0,
    doneLevels: new Set(),
    target: null,
    locked: false,
    pool: [],
  };

  // ---------- sound effects ----------
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTone({freq=440, freqEnd=null, duration=0.12, type='sine', volume=0.15, delay=0}){
    const ctx = ensureAudio();
    if(!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(freqEnd !== null){ osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0+duration); }
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(volume, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+duration+0.03);
  }
  function sfxCorrect(){ [660,880,1108].forEach((f,i)=>playTone({freq:f, duration:0.14, type:'triangle', volume:0.15, delay:i*0.08})); }
  function sfxWrong(){ playTone({freq:300, duration:0.12, type:'sine', volume:0.1}); playTone({freq:220, duration:0.18, type:'sine', volume:0.1, delay:0.1}); }
  function sfxFinish(){ [523,659,784,1046].forEach((f,i)=>playTone({freq:f, duration:0.16, type:'triangle', volume:0.16, delay:i*0.09})); }
  function sfxClick(){ playTone({freq:600, duration:0.05, type:'square', volume:0.06}); }
  function sfxChime(){ playTone({freq:880, duration:0.09, type:'sine', volume:0.08}); }

  // ---------- animal sound playback (TTS with synthesized fallback) ----------
  function ttsAvailable(){
    return typeof window !== 'undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
  }
  function playFallbackTone(animal){
    let t = 0;
    animal.tone.forEach(step => {
      if(step.f > 0){
        playTone({freq:step.f, freqEnd:step.fe||null, duration:step.d, type:step.t||'sine', volume:0.18, delay:t});
      }
      t += step.d + 0.02;
    });
  }
  function playAnimalSound(animal){
    speakerBtn.classList.remove('playing');
    void speakerBtn.offsetWidth;
    speakerBtn.classList.add('playing');
    sfxChime();
    let usedTTS = false;
    if(ttsAvailable()){
      try{
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(animal.sound);
        utter.lang = 'id-ID';
        utter.rate = 0.85;
        utter.pitch = 1.15;
        utter.volume = 1;
        utter.onerror = () => playFallbackTone(animal);
        window.speechSynthesis.speak(utter);
        usedTTS = true;
      }catch(e){ usedTTS = false; }
    }
    if(!usedTTS) playFallbackTone(animal);
  }

  // ---------- background music ----------
  let musicOn = false;
  let musicTimer = null;
  let musicGain = null;
  let musicStep = 0;
  const MUSIC_PATTERN = [392.00, null, 440.00, 523.25, null, 587.33, 523.25, null, 440.00, null, 392.00, null];
  const musicToggleBtn = document.getElementById('musicToggle');

  function ensureMusicGain(){
    const ctx = ensureAudio();
    if(!ctx) return null;
    if(!musicGain){
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.0001;
      musicGain.connect(ctx.destination);
    }
    return musicGain;
  }
  function playMusicNote(freq){
    const ctx = ensureAudio();
    const gainBus = ensureMusicGain();
    if(!ctx || !gainBus) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.04, t0+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);
    osc.connect(g).connect(gainBus);
    osc.start(t0);
    osc.stop(t0+0.55);
  }
  function startMusic(){
    const ctx = ensureAudio();
    const gainBus = ensureMusicGain();
    if(!ctx || !gainBus || musicTimer) return;
    gainBus.gain.cancelScheduledValues(ctx.currentTime);
    gainBus.gain.linearRampToValueAtTime(1, ctx.currentTime+0.6);
    musicStep = 0;
    musicTimer = setInterval(()=>{
      const note = MUSIC_PATTERN[musicStep % MUSIC_PATTERN.length];
      if(note) playMusicNote(note);
      musicStep++;
    }, 470);
  }
  function stopMusic(){
    if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
    if(musicGain){
      const ctx = ensureAudio();
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+0.3);
    }
  }
  function updateMusicBtn(){
    musicToggleBtn.textContent = musicOn ? '🔊' : '🔇';
    musicToggleBtn.classList.toggle('on', musicOn);
  }
  musicToggleBtn.onclick = () => {
    musicOn = !musicOn;
    if(musicOn){ ensureAudio(); startMusic(); } else { stopMusic(); }
    updateMusicBtn();
  };

  // ---------- menu ----------
  function buildLevelGrid(){
    levelGrid.innerHTML = '';
    Object.entries(LEVELS).forEach(([key, cfg]) => {
      const btn = document.createElement('button');
      btn.className = 'level-btn' + (key===state.levelKey ? ' active':'') + (state.doneLevels.has(key) ? ' level-done':'');
      btn.innerHTML = cfg.label + '<small>' + cfg.sub + '</small>';
      btn.onclick = () => {
        sfxClick();
        state.levelKey = key;
        [...levelGrid.children].forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      };
      levelGrid.appendChild(btn);
    });
  }
  buildLevelGrid();

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function updateStats(){
    document.getElementById('lblMoves').textContent = state.moves;
    document.getElementById('lblCorrect').textContent = state.correctCount;
    document.getElementById('lblTotal').textContent = state.totalRounds;
  }

  function buildRound(){
    const cfg = LEVELS[state.levelKey];
    state.target = state.pool[state.roundIdx];
    state.locked = false;

    const others = shuffle(ANIMALS.filter(a => a.emoji !== state.target.emoji)).slice(0, cfg.choices-1);
    const options = shuffle([state.target, ...others]);

    choicesGrid.style.gridTemplateColumns = cfg.choices <= 3 ? 'repeat(3,1fr)' : 'repeat(3,1fr)';
    choicesGrid.innerHTML = '';
    options.forEach(animal => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = animal.emoji;
      btn.onclick = () => onChoose(animal, btn);
      choicesGrid.appendChild(btn);
    });

    updateStats();
    setTimeout(() => playAnimalSound(state.target), 350);
  }

  function onChoose(animal, btn){
    if(state.locked) return;
    state.moves++;
    updateStats();
    if(animal.emoji === state.target.emoji){
      state.locked = true;
      btn.classList.add('correct');
      sfxCorrect();
      state.correctCount++;
      updateStats();
      setTimeout(() => {
        state.roundIdx++;
        if(state.roundIdx >= state.totalRounds){
          showFinish();
        } else {
          buildRound();
        }
      }, 900);
    } else {
      btn.classList.add('wrong');
      sfxWrong();
      setTimeout(() => btn.classList.remove('wrong'), 420);
    }
  }

  speakerBtn.onclick = () => { if(state.target) playAnimalSound(state.target); };

  function showFinish(){
    sfxFinish();
    gameScreen.style.display = 'none';
    finishScreen.style.display = 'flex';
    document.getElementById('finalMoves').textContent = state.moves;

    state.doneLevels.add(state.levelKey);
    const curIdx = LEVEL_ORDER.indexOf(state.levelKey);
    const nextKey = LEVEL_ORDER[curIdx+1];
    const nextBtn = document.getElementById('nextLevelBtn');
    const kicker = document.getElementById('finishKicker');
    const title = document.getElementById('finishTitle');

    if(nextKey){
      kicker.textContent = 'Level ' + LEVELS[state.levelKey].label + ' Selesai!';
      title.textContent = '🎉 Semua suara ditebak!';
      nextBtn.hidden = false;
      nextBtn.textContent = 'Lanjut ke Level ' + LEVELS[nextKey].label + ' <i class="bi bi-arrow-right-short"></i>';
      nextBtn.onclick = () => { sfxClick(); state.levelKey = nextKey; startGame(); };
    } else {
      kicker.textContent = 'Semua Level Selesai!';
      title.textContent = '<i class="bi bi-trophy-fill" style="color:#FFC93C"></i> Kamu Jago Tebak Suara!';
      nextBtn.hidden = true;
    }
  }

  function startGame(){
    ensureAudio();
    const cfg = LEVELS[state.levelKey];
    state.totalRounds = cfg.rounds;
    state.roundIdx = 0;
    state.correctCount = 0;
    state.moves = 0;
    state.pool = shuffle(ANIMALS).slice(0, cfg.rounds);
    menuScreen.style.display = 'none';
    finishScreen.style.display = 'none';
    gameScreen.style.display = 'flex';
    buildRound();
  }
  function backToMenu(){
    if(ttsAvailable()) window.speechSynthesis.cancel();
    gameScreen.style.display = 'none';
    finishScreen.style.display = 'none';
    menuScreen.style.display = 'flex';
    buildLevelGrid();
  }

  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('backBtn').onclick = () => { sfxClick(); backToMenu(); };
  document.getElementById('restartBtn').onclick = () => { sfxClick(); startGame(); };
  document.getElementById('menuBtn2').onclick = () => { sfxClick(); backToMenu(); };
})();
</script>
</body>
</html>
