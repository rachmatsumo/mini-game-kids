<style>
:root{--plum:#3B2A5E;--coral:#FF6B6B;--sun:#FFD43B;--leaf:#4CAF50}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:Fredoka,"Nunito","Segoe UI Rounded",system-ui,sans-serif;color:var(--plum);touch-action:manipulation}
body{background:#8FD3FF}
body.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(6px,-2px)}}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse,transparent 40%,rgba(255,40,40,.55));opacity:0;transition:opacity .3s}
#flash.on{opacity:1}

/* ===== Lingkungan ===== */
#env{position:fixed;inset:0;z-index:0;overflow:hidden}
#env svg.layer{position:absolute;inset:0;width:100%;height:100%}
#env .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.28));pointer-events:none}
.env-menu{background:linear-gradient(#D6EEFF,#8FD3FF 55%,#7ED957 55%,#3E8E3E)}
.env-semut{background:linear-gradient(#C9E6FF 0%,#9AD65A 28%,#6FA13E 33%,#A8703F 36%,#6B4223 100%)}
.env-kupu{background:linear-gradient(#F2FAFF,#9FD5FF 58%,#8ED26A 58%,#3F8F3C)}
.env-balon{background:linear-gradient(#FFF4F8,#C8E7FF 45%,#74BDF0)}
.env-bintang{background:radial-gradient(ellipse at 50% 115%,#4A3A96,#170F3D 55%,#070518)}
.env-ikan{background:linear-gradient(#62D2FA,#1C8BD4 40%,#083D78)}
.env-katak{background:linear-gradient(#D4F3FF 0%,#8ED27A 24%,#2E8E5C 27%,#2A87A6 30%,#0F4E6B)}
.ray{position:absolute;top:-20%;width:12vw;height:140%;background:linear-gradient(rgba(255,255,255,.35),transparent 70%);transform:skewX(-18deg);filter:blur(10px);animation:rayf 6s ease-in-out infinite alternate}
@keyframes rayf{from{opacity:.3}to{opacity:.8}}
.bubble{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.9),rgba(255,255,255,.15) 60%,rgba(255,255,255,.4));animation:bub linear infinite}
@keyframes bub{to{transform:translateY(-110vh)}}
.twinkle{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff;animation:tw 2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:scale(1.4)}}
.sunr{position:absolute;top:4vh;right:6vw;width:16vmin;height:16vmin;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFF6C2,#FFD43B 60%,#FFB300);box-shadow:0 0 4vmin #FFE57A,0 0 12vmin rgba(255,212,59,.5),0 0 30vmin rgba(255,212,59,.25)}
.cloud{position:absolute;width:26vmin;height:9vmin;background:linear-gradient(#fff,#E4EEF6);border-radius:10vmin;animation:drift 60s linear infinite;filter:drop-shadow(0 1vmin 1.5vmin rgba(40,80,120,.2))}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:12vmin;height:12vmin;left:4vmin;top:-6vmin}.cloud::after{width:9vmin;height:9vmin;left:13vmin;top:-4vmin}
@keyframes drift{from{left:-30vmin}to{left:110vw}}
.sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.fog{position:absolute;left:0;right:0;height:30vh;background:linear-gradient(transparent,rgba(255,255,255,.35));pointer-events:none}

/* ===== Layar ===== */
.screen{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vmin;text-align:center;overflow:auto}
.hidden{display:none!important}
h1{font-size:clamp(40px,11vmin,96px);margin:0 0 1vmin;color:#fff;text-shadow:0 .1em 0 var(--plum),0 .14em .6em rgba(0,0,0,.3);line-height:1}
h1 span{display:inline-block;animation:bounce 1.6s ease-in-out infinite}
h1 span:nth-child(2n){animation-delay:.2s}h1 span:nth-child(3n){animation-delay:.4s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-.18em)}}
.sub{font-size:clamp(17px,3.8vmin,24px);margin:0 0 2.5vmin;font-weight:700}
.segrow{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center;margin-bottom:3vmin}
.seg{display:inline-flex;background:rgba(255,255,255,.6);backdrop-filter:blur(6px);border-radius:999px;padding:.6vmin;box-shadow:0 4px 0 rgba(59,42,94,.2)}
.seg button{border:0;border-radius:999px;padding:1.4vmin 3vmin;font:inherit;font-weight:700;font-size:clamp(14px,3.2vmin,19px);background:transparent;color:var(--plum);cursor:pointer}
.seg button.on{background:var(--plum);color:#fff}
.lvlinfo{font-size:clamp(13px,3vmin,17px);opacity:.8;margin:-1.5vmin 0 2.5vmin}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6vmin;width:min(92vw,620px)}
@media(max-width:420px){.themes{grid-template-columns:repeat(2,1fr)}}
.theme{border:0;border-radius:26px;padding:2.4vmin 1.5vmin;background:linear-gradient(#fff,#F1F3F8);box-shadow:0 9px 0 rgba(59,42,94,.25),0 12px 24px rgba(0,0,0,.15);cursor:pointer;transition:transform .12s,box-shadow .12s;font:inherit;color:var(--plum);position:relative;overflow:hidden}
.theme::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--bg),transparent 70%);opacity:.5}
.theme>*{position:relative}
.theme:active{transform:translateY(8px);box-shadow:0 1px 0 rgba(59,42,94,.25)}
.theme svg{width:clamp(54px,13vmin,90px);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
.theme .nm{display:block;font-size:clamp(16px,3.6vmin,22px);font-weight:700;margin-top:1vmin}
.theme .best{display:block;font-size:clamp(12px,2.6vmin,15px);opacity:.7}
.link{background:none;border:0;font:inherit;font-weight:700;color:var(--plum);text-decoration:underline;font-size:clamp(16px,3.6vmin,22px);margin-top:3vmin;cursor:pointer}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:3vmin 4vmin;pointer-events:none;z-index:5}
.pill{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:999px;padding:1.4vmin 3.5vmin;font-size:clamp(20px,5vmin,36px);font-weight:700;box-shadow:0 6px 0 rgba(59,42,94,.25),0 8px 18px rgba(0,0,0,.2);pointer-events:auto;transition:transform .15s}
.pill.bump{transform:scale(1.25) rotate(-4deg)}
.pill.bad{transform:scale(.85);color:var(--coral)}
.pill.low{color:var(--coral);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
.pill.btn{border:0;font:inherit;cursor:pointer;padding:1.4vmin 2.6vmin}
#warn{position:fixed;top:14vh;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:clamp(18px,4.5vmin,30px);font-weight:700;color:#fff;text-shadow:0 2px 0 var(--plum),0 4px 12px rgba(0,0,0,.4);opacity:0;transition:opacity .4s}
#warn.on{opacity:1}

/* Arena & objek */
#arena{position:fixed;inset:0;overflow:hidden;z-index:1;perspective:800px}
.obj{position:absolute;width:var(--s);height:var(--s);cursor:pointer;will-change:transform;animation:spawn .4s cubic-bezier(.2,1.6,.4,1) both;z-index:var(--z,2)}
.obj .face{width:100%;height:100%;filter:drop-shadow(0 calc(var(--s)*.09) calc(var(--s)*.06) rgba(0,0,0,.35))}
.obj.far .face{filter:drop-shadow(0 4px 3px rgba(0,0,0,.25)) blur(.6px) saturate(.85)}
.obj.flip .face{transform:scaleX(-1)}
.obj svg{width:100%;height:100%;overflow:visible}
.obj.ground::after{content:"";position:absolute;left:15%;right:15%;bottom:-6%;height:12%;background:radial-gradient(ellipse,rgba(0,0,0,.4),transparent 70%);z-index:-1}
@keyframes spawn{from{transform:scale(0)}to{transform:scale(1)}}
.obj.pop{animation:popout .35s ease-out forwards;pointer-events:none}
@keyframes popout{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(0);opacity:0}}
.obj.hazard.pop{animation:hazpop .5s ease-out forwards}
@keyframes hazpop{0%{transform:scale(1);filter:none}30%{transform:scale(1.3);filter:brightness(3) saturate(0)}100%{transform:scale(.4) rotate(40deg);opacity:0}}
/* bagian tubuh */
.wL,.wR{transform-box:fill-box;animation:flap .2s ease-in-out infinite alternate}
.wL{transform-origin:right center}.wR{transform-origin:left center;animation-direction:alternate-reverse}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.2)}}
.bw{transform-box:fill-box;transform-origin:center bottom;animation:bflap .06s linear infinite alternate}
@keyframes bflap{from{transform:scaleY(1)}to{transform:scaleY(.3)}}
.leg{transform-box:fill-box;transform-origin:top center;animation:walk .16s ease-in-out infinite alternate}
.leg.b{animation-direction:alternate-reverse}
@keyframes walk{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.ant{transform-box:fill-box;transform-origin:center;animation:bob .16s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
.tail{transform-box:fill-box;transform-origin:right center;animation:wag .28s ease-in-out infinite alternate}
.fin{transform-box:fill-box;transform-origin:top center;animation:wag .4s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.ball{transform-box:fill-box;transform-origin:bottom center;animation:sway 2.4s ease-in-out infinite alternate}
.starb{transform-box:fill-box;transform-origin:center;animation:twk 1s ease-in-out infinite alternate}
@keyframes twk{from{transform:scale(.85) rotate(-6deg)}to{transform:scale(1.1) rotate(6deg)}}
.frog{transform-box:fill-box;transform-origin:bottom center}
.obj.hop .frog{animation:hop .5s ease-out}
@keyframes hop{0%{transform:scaleY(.8)}30%{transform:translateY(-40%) scaleY(1.1)}100%{transform:translateY(0)}}
.obj.idle .frog{animation:breathe 1.2s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scaleY(1)}to{transform:scaleY(.94)}}
.jelly{transform-box:fill-box;transform-origin:center top;animation:jelly .9s ease-in-out infinite alternate}
@keyframes jelly{from{transform:scaleX(1) scaleY(1)}to{transform:scaleX(.85) scaleY(1.1)}}
.tent{transform-box:fill-box;transform-origin:top center;animation:sway 1s ease-in-out infinite alternate}
.fuse{transform-box:fill-box;transform-origin:center;animation:spark .2s steps(2) infinite}
@keyframes spark{to{opacity:.2;transform:scale(1.4)}}
.bolt{animation:boltf .5s steps(2) infinite}
@keyframes boltf{to{opacity:.1}}
.snakeb{transform-box:fill-box;transform-origin:left center;animation:wag .5s ease-in-out infinite alternate}
.pulseR{animation:pr 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pr{from{opacity:.15;transform:scale(.9)}to{opacity:.45;transform:scale(1.1)}}

.bit{position:absolute;width:14px;height:14px;border-radius:50%;pointer-events:none;animation:bit .6s ease-out forwards;z-index:50;box-shadow:0 0 6px currentColor}
@keyframes bit{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.plus{position:absolute;font-size:clamp(28px,7vmin,52px);font-weight:700;color:#fff;text-shadow:0 3px 0 var(--plum),0 6px 12px rgba(0,0,0,.3);pointer-events:none;animation:rise .7s ease-out forwards;z-index:50}
.plus.neg{color:#FF4D4D}
@keyframes rise{to{transform:translateY(-90px);opacity:0}}

/* Hasil & papan skor */
.card{background:linear-gradient(#fff,#F4F5FA);border-radius:36px;padding:5vmin 6vmin;box-shadow:0 14px 0 rgba(59,42,94,.25),0 20px 40px rgba(0,0,0,.25);width:min(92vw,520px)}
.big{font-size:clamp(64px,20vmin,150px);font-weight:700;line-height:1;color:var(--coral)}
.stars{font-size:clamp(40px,10vmin,80px);letter-spacing:.05em}
.stars span{display:inline-block;opacity:0;animation:starin .5s cubic-bezier(.2,1.6,.4,1) forwards}
.stars span:nth-child(2){animation-delay:.3s}.stars span:nth-child(3){animation-delay:.6s}
@keyframes starin{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1);opacity:1}}
.row{display:flex;gap:2.5vmin;justify-content:center;flex-wrap:wrap;margin-top:3.5vmin}
.cta{border:0;border-radius:999px;padding:2.4vmin 5vmin;font:inherit;font-size:clamp(18px,4.5vmin,28px);font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(#FF8A8A,var(--coral));box-shadow:0 8px 0 #c94b4b}
.cta.alt{background:linear-gradient(#6FCF73,var(--leaf));box-shadow:0 8px 0 #2f7d33}
.cta.plum{background:linear-gradient(#5A4687,var(--plum));box-shadow:0 8px 0 #221737}
.cta:active{transform:translateY(6px);box-shadow:none}
table{width:100%;border-collapse:collapse;font-size:clamp(15px,3.6vmin,21px);margin-top:2vmin}
td,th{padding:1.3vmin .8vmin;text-align:left;border-bottom:2px dashed #eee}
th{font-size:.75em;opacity:.6;text-transform:uppercase;letter-spacing:.08em}
tr.new td{background:#FFF6C7}
.tab{display:flex;gap:1vmin;flex-wrap:wrap;justify-content:center;margin-top:2vmin}
.tab button{border:0;border-radius:999px;padding:1vmin 2.4vmin;font:inherit;font-weight:700;background:#eee;cursor:pointer;color:var(--plum)}
.tab button.on{background:var(--plum);color:#fff}
.empty{opacity:.6;padding:4vmin 0}
.lv{font-size:.75em;padding:.2em .6em;border-radius:999px;background:#eee}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

  .mascot-icon {
    font-size: 32px;
    width: 60px;
    height: 60px;
    border-radius: 20px;
    background: linear-gradient(135deg, #FFC93C, #FF9F1C);
    border: 3px solid #FFF;
    box-shadow: 0 8px 20px rgba(255, 159, 28, 0.4);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #3A2400;
    animation: mascotFloat 3s ease-in-out infinite;
  }
  @keyframes mascotFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }


  .mascot-img-wrap {
    width: 84px;
    height: 84px;
    border-radius: 24px;
    border: 4px solid #FFC93C;
    box-shadow: 0 10px 25px rgba(255, 201, 60, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.6);
    overflow: hidden;
    background: #FFF;
    display: inline-block;
    margin-bottom: 8px;
    animation: mascotFloat 3s ease-in-out infinite;
  }
  .mascot-3d-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  @keyframes mascotFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

</style>
</head>

  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'MAINEDU_SUBMIT_SCORE',
        gameKey: gameKey,
        score: Number(score) || 0

}

/* ===== Suara ===== */
let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,dur,type='sine',vol=.25,slide=0){const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur);}
const SFX={pop(){tone(600+Math.random()*400,.12,'square',.18,300)},combo(n){[0,1,2].forEach(i=>setTimeout(()=>tone(520*Math.pow(1.25,i+Math.min(n,4)),.15,'triangle',.2),i*70))},tick(){tone(900,.06,'sine',.12)},start(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.22),i*110))},end(){[784,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.35,'triangle',.22),i*160))},miss(){tone(160,.12,'sawtooth',.08,-60)},bad(){tone(220,.35,'sawtooth',.25,-150);setTimeout(()=>tone(150,.4,'square',.2,-100),120)}};

let themeKey,theme,mode='timed',lvl=0,score,combo,lastHit,timeLeft,elapsed,timer,spawner,objs=new Set(),running=false;
const BOARD={};for(const k in THEMES)BOARD[k]=[];

/* Menu */
$('modeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$('modeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
$('lvlSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{lvl=+b.dataset.l;$('lvlSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('lvlinfo').textContent=LEVELS[lvl].info;});
$('lvlinfo').textContent=LEVELS[0].info;
function renderMenu(){const d=$('themes');d.innerHTML='';for(const k in THEMES){const t=THEMES[k],b=document.createElement('button');b.className='theme';b.style.setProperty('--bg',t.bg);const best=BOARD[k].length?Math.max(...BOARD[k].map(r=>r.s)):null;b.innerHTML=`${t.sp()}<span class="nm">${t.nm}</span><span class="best">${best!==null?'Terbaik: '+best:'Belum main'}</span>`;b.onclick=()=>{ac();start(k)};d.appendChild(b);}}
renderMenu();
function show(id){['menu','result','board'].forEach(s=>$(s).classList.toggle('hidden',s!==id));const on=id==='game';arena.classList.toggle('hidden',!on);$('hud').classList.toggle('hidden',!on);}
function warn(msg){const w=$('warn');w.textContent=msg;w.classList.add('on');clearTimeout(w.t);w.t=setTimeout(()=>w.classList.remove('on'),1800);}

/* Game */
function start(k){
 themeKey=k;theme=THEMES[k];score=0;combo=0;lastHit=0;timeLeft=60;elapsed=0;running=true;
 arena.innerHTML='';objs.clear();buildEnv(k);
 $('score').textContent='⭐ 0';$('time').classList.remove('low');$('time').textContent=mode==='timed'?'⏱ 60':'∞ 0';
 show('game');SFX.start();clearInterval(timer);clearTimeout(spawner);
 if(lvl>0)setTimeout(()=>warn(`⚠️ Awas ${theme.haz.nm}! Jangan disentuh`),600);
 timer=setInterval(()=>{elapsed++;if(mode==='timed'){timeLeft--;$('time').textContent='⏱ '+timeLeft;if(timeLeft<=10){$('time').classList.add('low');SFX.tick();}if(timeLeft<=0)end();}else{$('time').textContent='∞ '+fmt(elapsed);}},1000);
 spawnLoop();
}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function spawnLoop(){spawn();spawner=setTimeout(spawnLoop,Math.max(330,(1100-Math.min(elapsed,60)*12)/LEVELS[lvl].spd));}
function spawn(){
 if(!running||objs.size>=8)return;
 const L=LEVELS[lvl],W=innerWidth,H=innerHeight,t=theme,isHaz=Math.random()<L.hazRate,el=document.createElement('div');
 const move=isHaz?t.haz.move:t.move;
 el.className='obj'+(isHaz?' hazard':'')+(t.ground&&!isHaz?' ground':'');
 const depth=Math.random();if(depth<.3)el.classList.add('far');el.style.setProperty('--z',Math.round(2+depth*10));
 const s=R(t.size[0],t.size[1])*(W<500?.85:1)*L.sizeMul*(.8+depth*.3)*(isHaz?1.05:1);el.style.setProperty('--s',s+'px');
 el.innerHTML=`<div class="face">${isHaz?t.haz.sp():t.sp()}</div>`;
 const band=t.band||[.1,.85];
 let x=R(s,W-s*1.5),y=R(H*band[0],H*band[1]-s),vx=0,vy=0,sp=R(t.speed[0]||50,t.speed[1]||90)*L.spd;
 if(move==='crawl'||move==='swim'){const dir=Math.random()<.5?-1:1;x=dir>0?-s:W+s;vx=dir*sp;if(dir<0)el.classList.add('flip');}
 if(move==='fly'){vx=R(-sp,sp)||sp;vy=R(-sp*.6,sp*.6);if(vx<0)el.classList.add('flip');}
 if(move==='rise'){y=H+s;vx=R(-15,15);vy=-sp;}
 if(move==='hop')el.classList.add('idle');
 const o={el,x,y,vx,vy,move,haz:isHaz,born:performance.now(),life:(t.life&&move===t.move)?R(t.life[0],t.life[1]):(move==='float'?R(2000,3500):1e9),dead:false,s,phase:Math.random()*6.28,baseY:y};
 el.style.left=x+'px';el.style.top=y+'px';
 el.addEventListener('pointerdown',e=>{e.preventDefault();hit(o,e);});
 arena.appendChild(el);objs.add(o);
 if(move==='hop'){o.hop=setInterval(()=>{if(o.dead)return;o.x=R(s,W-s*1.5);o.y=R(H*band[0],H*band[1]-s);o.el.style.left=o.x+'px';o.el.style.top=o.y+'px';o.el.classList.remove('idle');o.el.classList.add('hop');setTimeout(()=>{o.el.classList.remove('hop');o.el.classList.add('idle');},500);},1100/L.spd);}
}
function kill(o){o.dead=true;clearInterval(o.hop);o.el.classList.add('pop');setTimeout(()=>{o.el.remove();objs.delete(o);},500);}
function hit(o,e){
 if(o.dead||!running)return;
 const sc=$('score');
 if(o.haz){
  const pen=LEVELS[lvl].penalty;score=Math.max(0,score-pen);combo=0;sc.textContent='⭐ '+score;
  sc.classList.add('bad');setTimeout(()=>sc.classList.remove('bad'),300);
  SFX.bad();document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),400);
  $('flash').classList.add('on');setTimeout(()=>$('flash').classList.remove('on'),300);
  if(navigator.vibrate)navigator.vibrate([60,40,60]);
  burst(e.clientX,e.clientY,-pen,0,true);warn(`Aduh! Itu ${theme.haz.nm} 😖`);kill(o);return;
 }
 const now=performance.now();combo=(now-lastHit<1200)?combo+1:1;lastHit=now;
 const pts=combo>=3?2:1;score+=pts;sc.textContent='⭐ '+score;
 sc.classList.add('bump');setTimeout(()=>sc.classList.remove('bump'),150);
 combo>=3?SFX.combo(combo):SFX.pop();burst(e.clientX,e.clientY,pts,combo);
 if(navigator.vibrate)navigator.vibrate(30);kill(o);
}
function burst(x,y,pts,combo,bad){
 const cols=bad?['#FF3B3B','#FF8A00','#444']:theme.col;
 for(let i=0;i<16;i++){const b=document.createElement('div');b.className='bit';const a=Math.random()*6.28,d=R(40,130);b.style.left=x-7+'px';b.style.top=y-7+'px';b.style.background=cols[i%cols.length];b.style.color=cols[i%cols.length];b.style.setProperty('--dx',Math.cos(a)*d+'px');b.style.setProperty('--dy',Math.sin(a)*d+'px');arena.appendChild(b);setTimeout(()=>b.remove(),600);}
 const p=document.createElement('div');p.className='plus'+(bad?' neg':'');p.textContent=bad?`${pts} 💥`:combo>=3?`+${pts} 🔥`:`+${pts}`;p.style.left=x-24+'px';p.style.top=y-40+'px';arena.appendChild(p);setTimeout(()=>p.remove(),700);
}
arena.addEventListener('pointerdown',e=>{if(e.target===arena&&running){SFX.miss();combo=0;}});

let last=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(running){const W=innerWidth,H=innerHeight,t=now/1000,band=theme.band||[.1,.85];
  for(const o of objs){if(o.dead)continue;
   o.x+=o.vx*dt;o.y+=o.vy*dt;
   if(o.move==='swim')o.y=o.baseY+Math.sin(t*2+o.phase)*14;
   if(o.move==='crawl')o.y=o.baseY+Math.sin(t*12+o.phase)*1.5;
   if(o.move==='rise')o.x+=Math.sin(t*1.5+o.phase)*.5;
   if(o.move==='float')o.y=o.baseY+Math.sin(t*2+o.phase)*8;
   if(o.move==='fly'){o.y+=Math.sin(t*4+o.phase)*.8;if(o.x<0||o.x>W-o.s){o.vx*=-1;o.el.classList.toggle('flip',o.vx<0);}if(o.y<H*.08||o.y>H*band[1]-o.s)o.vy*=-1;}
   o.el.style.left=o.x+'px';o.el.style.top=o.y+'px';
   if(o.x<-o.s*2||o.x>W+o.s*2||o.y<-o.s*2||o.y>H+o.s*2||now-o.born>o.life)kill(o);
  }}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* Selesai */
let lastRec=null,boardTab='semut';
function end(){
 running=false;clearInterval(timer);clearTimeout(spawner);objs.forEach(o=>clearInterval(o.hop));
 const rec={s:score,m:mode,l:lvl,t:elapsed,at:Date.now()};BOARD[themeKey].push(rec);BOARD[themeKey].sort((a,b)=>b.s-a.s);BOARD[themeKey]=BOARD[themeKey].slice(0,5);
 show('result');SFX.end();$('finalScore').textContent=score;
 const rate=(mode==='timed'?score:score/Math.max(1,elapsed)*60)*(1+lvl*.25),n=rate>=45?3:rate>=25?2:1;
 $('stars').innerHTML=['⭐','⭐','⭐'].slice(0,n).map(s=>`<span>${s}</span>`).join('')+'<span style="opacity:.15;animation:none">'+'⭐'.repeat(3-n)+'</span>';
 const isBest=BOARD[themeKey][0]===rec&&BOARD[themeKey].length>1;
 $('praise').textContent=isBest?'🏅 Rekor baru! Luar biasa!':n===3?'Luar biasa! Kamu juara! 🏆':n===2?'Hebat sekali! 🎉':'Bagus! Coba lagi yuk! 💪';
 lastRec=rec;renderMenu();
}
function renderBoard(){
 const tabs=$('boardTabs');tabs.innerHTML='';for(const k in THEMES){const b=document.createElement('button');b.textContent=THEMES[k].nm;b.classList.toggle('on',k===boardTab);b.onclick=()=>{boardTab=k;renderBoard();};tabs.appendChild(b);}
 const rows=BOARD[boardTab];
 $('boardBody').innerHTML=rows.length?`<table><tr><th>#</th><th>Skor</th><th>Level</th><th>Mode</th><th>Waktu</th></tr>${rows.map((r,i)=>`<tr class="${r===lastRec?'new':''}"><td>${['🥇','🥈','🥉','4','5'][i]}</td><td><b>${r.s}</b></td><td><span class="lv">${LEVELS[r.l].ico} ${LEVELS[r.l].nm}</span></td><td>${r.m==='timed'?'⏱ 60':'∞'}</td><td>${fmt(r.t)}</td></tr>`).join('')}</table>`:'<p class="empty">Belum ada skor. Ayo main dulu!</p>';
}
$('again').onclick=()=>start(themeKey);
$('home').onclick=()=>{buildEnv('menu');show('menu');};
$('toBoard').onclick=()=>{boardTab=themeKey;renderBoard();show('board');};
$('openBoard').onclick=()=>{renderBoard();show('board');};
$('boardHome').onclick=()=>{buildEnv('menu');show('menu');};
$('quit').onclick=()=>{if(mode==='free'&&score>0){end();}else{running=false;clearInterval(timer);clearTimeout(spawner);objs.forEach(o=>clearInterval(o.hop));buildEnv('menu');show('menu');}};
document.querySelectorAll('a[href="index.html"]').forEach(link => {
  link.addEventListener('click', (e) => {
    if (window.parent && typeof window.parent.closeGameStage === 'function') {
      e.preventDefault();
      window.parent.closeGameStage();
    }
  });
});
</script>
</body>
</html>
