<style>
  :root{
    --sky-top:#BFE7FF;
    --sky-bottom:#FFF6DE;
    --grass:#8FD17E;
    --grass-dark:#6FB85F;
    --card-back:#5B8DEF;
    --card-back-dark:#3F6FD1;
    --coral:#FF8A73;
    --yellow:#FFC947;
    --pink:#FF8FC0;
    --mint:#4FD6A8;
    --text-dark:#233247;
    --text-dim:#5C6E80;
    --panel-bg:rgba(255,255,255,.6);
    --font-display:'Fredoka', sans-serif;
    --font-body:'Nunito', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 65%);
    font-family:var(--font-body); color:var(--text-dark);}
  #stage{position:relative; width:100%; height:100vh; min-height:560px; display:flex; flex-direction:column; overflow:hidden;}
  [hidden]{display:none !important;}

  .cloud{position:absolute; background:#fff; border-radius:50%; opacity:.85; filter:blur(.2px);}
  .grass-strip{position:absolute; left:0; right:0; bottom:0; height:38px;
    background:linear-gradient(180deg, var(--grass), var(--grass-dark)); z-index:0;}
  .grass-strip::before{content:''; position:absolute; top:-10px; left:0; right:0; height:14px;
    background:repeating-linear-gradient(90deg, var(--grass) 0 10px, transparent 10px 20px);
    clip-path:polygon(0 100%, 5% 0, 10% 100%, 15% 0, 20% 100%, 25% 0, 30% 100%, 35% 0, 40% 100%, 45% 0, 50% 100%, 55% 0, 60% 100%, 65% 0, 70% 100%, 75% 0, 80% 100%, 85% 0, 90% 100%, 95% 0, 100% 100%);}

  #musicToggle{
    position:absolute; top:14px; right:14px; z-index:30;
    width:40px; height:40px; border-radius:50%;
    background:rgba(35,50,71,.1); border:1px solid rgba(35,50,71,.14);
    color:var(--text-dark); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, background .15s ease;
  }
  #musicToggle:hover{ background:rgba(35,50,71,.18); }
  #musicToggle:active{ transform:scale(.9); }
  #musicToggle.on{ background:linear-gradient(135deg, var(--mint), #2FBE8F); color:#0E3327; border-color:transparent; }

  /* ---------- MENU ---------- */
  #menuScreen{position:relative; z-index:2; flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px; gap:20px;}
  #menuScreen > *{ animation:menuIn .6s cubic-bezier(.22,.9,.32,1.1) both; }
  #menuScreen > *:nth-child(1){ animation-delay:.05s; }
  #menuScreen > *:nth-child(2){ animation-delay:.16s; }
  #menuScreen > *:nth-child(3){ animation-delay:.27s; }
  #menuScreen > *:nth-child(4){ animation-delay:.38s; }
  @keyframes menuIn{0%{opacity:0; transform:translateY(20px) scale(.97);} 100%{opacity:1; transform:translateY(0) scale(1);}}

  .mascot{position:absolute; top:6%; left:8%; font-size:38px; pointer-events:none;
    animation:bob 4.2s ease-in-out infinite, menuIn .6s ease .5s both;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg);} 50%{transform:translateY(-12px) rotate(5deg);}}

  .kicker{font-family:var(--font-body); font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    font-size:12px; color:#3F8F6B;}
  h1{font-family:var(--font-display); font-weight:700; font-size:clamp(28px,6vw,44px); margin:6px 0 0;
    color:var(--text-dark);}
  .subtitle{color:var(--text-dim); font-size:15px; max-width:400px; margin:6px auto 0; font-weight:700;}

  .panel{background:var(--panel-bg); border:1px solid rgba(35,50,71,.08); border-radius:20px;
    padding:18px 20px; width:min(92vw,420px); backdrop-filter:blur(6px);
    box-shadow:0 10px 26px rgba(35,50,71,.08);}
  .panel h2{font-family:var(--font-display); font-size:13px; font-weight:600; margin:0 0 12px;
    color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; text-align:left;}
  .level-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .level-btn{font-family:var(--font-body); font-weight:800; font-size:14px; color:var(--text-dark);
    background:rgba(255,255,255,.7); border:2px solid rgba(35,50,71,.1); border-radius:14px;
    padding:12px 6px; cursor:pointer; transition:all .15s ease;}
  .level-btn small{display:block; font-weight:700; color:var(--text-dim); font-size:11px; margin-top:3px;}
  .level-btn:hover{border-color:var(--mint); transform:translateY(-1px);}
  .level-btn.active{background:linear-gradient(135deg, var(--mint), #2FBE8F); color:#0E3327; border-color:transparent;
    box-shadow:0 6px 18px rgba(79,214,168,.35);}
  .level-btn.active small{color:#0E3327;}
  .level-btn{position:relative;}
  .level-btn.level-done::after{
    content:'✓'; position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--coral); color:#fff; font-size:11px; font-weight:800; display:flex;
    align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.2);
  }

  #startBtn{font-family:var(--font-display); font-weight:600; font-size:18px; color:#3A2400;
    background:linear-gradient(135deg, var(--yellow), #F5AE1E); border:none; border-radius:999px;
    padding:14px 40px; cursor:pointer; box-shadow:0 10px 26px rgba(255,201,71,.4); transition:transform .15s ease;}
  #startBtn:hover{transform:translateY(-2px) scale(1.02);}
  #startBtn:active{transform:translateY(0) scale(.98);}

  /* ---------- GAME ---------- */
  #gameScreen{position:relative; z-index:2; flex:1; display:none; flex-direction:column; min-height:0;}
  #topbar{display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:12px 60px 8px 16px; font-family:var(--font-body); font-weight:800; font-size:13px;
    color:var(--text-dim); flex-wrap:wrap;}
  #backBtn{background:rgba(35,50,71,.08); border:none; color:var(--text-dark); font-weight:800;
    border-radius:999px; padding:6px 14px; cursor:pointer; font-family:var(--font-body); font-size:12px;}
  .stat{background:rgba(255,255,255,.65); border-radius:999px; padding:6px 14px;}
  .stat b{color:var(--text-dark);}

  #boardWrap{flex:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:10px 16px 20px;}
  #cardGrid{display:grid; gap:10px; width:min(94vw, 460px);}

  .card{position:relative; aspect-ratio:1; perspective:700px; cursor:pointer;
    animation:cardIn .45s cubic-bezier(.22,.9,.32,1.15) both;}
  @keyframes cardIn{0%{opacity:0; transform:scale(.7) translateY(14px);} 100%{opacity:1; transform:scale(1) translateY(0);}}
  .card-inner{position:relative; width:100%; height:100%; transition:transform .45s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;}
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .card.shake .card-inner{animation:shakeCard .4s ease;}
  @keyframes shakeCard{
    0%,100%{transform:rotateY(180deg) translateX(0);}
    25%{transform:rotateY(180deg) translateX(-6px);}
    75%{transform:rotateY(180deg) translateX(6px);}
  }
  .card-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:16px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 14px rgba(35,50,71,.14);}
  .card-back{background:linear-gradient(155deg, var(--card-back), var(--card-back-dark)); font-size:26px; color:rgba(255,255,255,.55);}
  .card-front{background:#fff; transform:rotateY(180deg); font-size:clamp(26px,7vw,40px);}
  .card.matched .card-face{box-shadow:0 0 0 3px var(--mint), 0 8px 18px rgba(79,214,168,.35);}
  .card.matched{animation:matchedPulse .5s ease;}
  @keyframes matchedPulse{0%{transform:scale(1);} 40%{transform:scale(1.08);} 100%{transform:scale(1);}}

  /* ---------- FINISH ---------- */
  #finishScreen{position:relative; z-index:2; flex:1; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px;}
  .btn-row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  .secondary-btn{font-family:var(--font-body); font-weight:800; font-size:14px; color:var(--text-dark);
    background:rgba(255,255,255,.7); border:2px solid rgba(35,50,71,.12); border-radius:999px;
    padding:12px 26px; cursor:pointer;}
  .score-big{font-family:var(--font-display); font-size:44px; font-weight:700; color:#3F8F6B;}

  @media (prefers-reduced-motion: reduce){
    .mascot{animation:none;}
    #menuScreen > *{animation:menuIn .01s linear both;}
    .card{animation:none;}
    .card.matched{animation:none;}
  }

  .mascot-icon {
    font-size: 32px;
    width: 60px;
    height: 60px;
    border-radius: 20px;
    background: linear-gradient(135deg, #FFC93C, #FF9F1C);
    border: 3px solid #FFF;
    box-shadow: 0 8px 20px rgba(255, 159, 28, 0.4);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #3A2400;
    animation: mascotFloat 3s ease-in-out infinite;
  }
  @keyframes mascotFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

</style>

<body>
<div id="stage">
  <button id="musicToggle" aria-label="Musik latar"><i class="bi bi-volume-mute-fill"></i></button>
  <div class="cloud" style="width:70px;height:26px;top:8%;left:14%;"></div>
  <div class="cloud" style="width:50px;height:20px;top:14%;left:24%;"></div>
  <div class="cloud" style="width:60px;height:22px;top:10%;right:16%;"></div>

  <!-- MENU -->
  <div id="menuScreen">
    <div class="mascot" aria-hidden="true">🦊</div>
    <div class="title-wrap">
      <span class="kicker">Latihan Mengingat</span>
      <h1>🧠 Kartu Ingatan</h1>
      <p class="subtitle">Buka dua kartu, cari pasangan gambar yang sama. Ingat-ingat posisinya ya!</p>
    </div>
    <div class="panel">
      <h2>Pilih Level</h2>
      <div class="level-grid" id="levelGrid"></div>
    </div>
    <button id="startBtn">Mulai Bermain 🐾</button>
  </div>

  <!-- GAME -->
  <div id="gameScreen">
    <div id="topbar">
      <button id="backBtn"><i class="bi bi-arrow-left"></i> Menu</button>
      <div class="stat">Percobaan <b id="lblMoves">0</b></div>
      <div class="stat">Pasangan <b id="lblPairs">0</b>/<span id="lblTotalPairs">0</span></div>
    </div>
    <div id="boardWrap"><div id="cardGrid"></div></div>
  </div>

  <!-- FINISH -->
  <div id="finishScreen">
    <span class="kicker" id="finishKicker">Selesai!</span>
    <h1 id="finishTitle" style="font-size:clamp(24px,5vw,36px)">🎉 Semua pasangan ketemu!</h1>
    <div class="score-big" id="finalMoves">0</div>
    <p class="subtitle">kali percobaan</p>
    <div class="btn-row">
      <button class="secondary-btn" id="nextLevelBtn" hidden style="background:linear-gradient(135deg,var(--yellow),#F5AE1E); color:#3A2400; border:none;">Lanjut Level Berikutnya <i class="bi bi-arrow-right-short"></i></button>
    </div>
    <div class="btn-row">
      <button class="secondary-btn" id="restartBtn">🔁 Ulangi Level Ini</button>
      <button class="secondary-btn" id="menuBtn2" style="background:linear-gradient(135deg,var(--mint),#2FBE8F); color:#0E3327; border:none;">🏠 Menu Utama</button>
    </div>
  </div>

  <div class="grass-strip"></div>
</div>

<script>

function submitPortalScore(gameKey, score) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'MAINEDU_SUBMIT_SCORE',
        gameKey: gameKey,
        score: Number(score) || 0
      }, '*');
    }
  } catch(e) {}
}

const CURRENT_GAME_KEY = "memory";
(function(){
  const LEVELS = {
    mudah:  { label:'Mudah',  sub:'3 pasang', pairs:3, cols:3 },
    sedang: { label:'Sedang', sub:'6 pasang', pairs:6, cols:4 },
    sulit:  { label:'Sulit',  sub:'8 pasang', pairs:8, cols:4 },
  };
  const LEVEL_ORDER = ['mudah', 'sedang', 'sulit'];
  const ANIMAL_POOL = ['🐶','🐱','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐵','🐔','🐧','🦉','🐢'];
  const PRAISE = ['Hebat!', 'Pintar!', 'Cocok!', 'Keren!', 'Asyik!'];

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const finishScreen = document.getElementById('finishScreen');
  const levelGrid = document.getElementById('levelGrid');
  const cardGrid = document.getElementById('cardGrid');

  let state = {
    levelKey: 'mudah',
    cards: [],
    openIndices: [],
    moves: 0,
    matchedPairs: 0,
    totalPairs: 3,
    locked: false,
    doneLevels: new Set(),
  };

  // ---------- sound effects ----------
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTone({freq=440, freqEnd=null, duration=0.12, type='sine', volume=0.15, delay=0}){
    const ctx = ensureAudio();
    if(!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(freqEnd !== null){ osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0+duration); }
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(volume, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+duration+0.03);
  }
  function sfxFlip(){ playTone({freq:520, freqEnd:640, duration:0.08, type:'triangle', volume:0.12}); }
  function sfxMatch(){ [660,880,1108].forEach((f,i)=>playTone({freq:f, duration:0.14, type:'triangle', volume:0.15, delay:i*0.08})); }
  function sfxMismatch(){ playTone({freq:300, duration:0.12, type:'sine', volume:0.1}); playTone({freq:220, duration:0.18, type:'sine', volume:0.1, delay:0.1}); }
  function sfxFinish(){ [523,659,784,1046].forEach((f,i)=>playTone({freq:f, duration:0.16, type:'triangle', volume:0.16, delay:i*0.09})); }
  function sfxClick(){ playTone({freq:600, duration:0.05, type:'square', volume:0.06}); }

  // ---------- background music ----------
  let musicOn = false;
  let musicTimer = null;
  let musicGain = null;
  let musicStep = 0;
  const MUSIC_PATTERN = [392.00, null, 440.00, 493.88, null, 523.25, 493.88, null, 440.00, null, 392.00, null];
  const musicToggleBtn = document.getElementById('musicToggle');

  function ensureMusicGain(){
    const ctx = ensureAudio();
    if(!ctx) return null;
    if(!musicGain){
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.0001;
      musicGain.connect(ctx.destination);
    }
    return musicGain;
  }
  function playMusicNote(freq){
    const ctx = ensureAudio();
    const gainBus = ensureMusicGain();
    if(!ctx || !gainBus) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.045, t0+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);
    osc.connect(g).connect(gainBus);
    osc.start(t0);
    osc.stop(t0+0.55);
  }
  function startMusic(){
    const ctx = ensureAudio();
    const gainBus = ensureMusicGain();
    if(!ctx || !gainBus || musicTimer) return;
    gainBus.gain.cancelScheduledValues(ctx.currentTime);
    gainBus.gain.linearRampToValueAtTime(1, ctx.currentTime+0.6);
    musicStep = 0;
    musicTimer = setInterval(()=>{
      const note = MUSIC_PATTERN[musicStep % MUSIC_PATTERN.length];
      if(note) playMusicNote(note);
      musicStep++;
    }, 450);
  }
  function stopMusic(){
    if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
    if(musicGain){
      const ctx = ensureAudio();
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+0.3);
    }
  }
  function updateMusicBtn(){
    musicToggleBtn.textContent = musicOn ? '🔊' : '🔇';
    musicToggleBtn.classList.toggle('on', musicOn);
  }
  musicToggleBtn.onclick = () => {
    musicOn = !musicOn;
    if(musicOn){ ensureAudio(); startMusic(); } else { stopMusic(); }
    updateMusicBtn();
  };

  // ---------- menu ----------
  function buildLevelGrid(){
    levelGrid.innerHTML = '';
    Object.entries(LEVELS).forEach(([key, cfg]) => {
      const btn = document.createElement('button');
      btn.className = 'level-btn' + (key===state.levelKey ? ' active':'') + (state.doneLevels.has(key) ? ' level-done':'');
      btn.innerHTML = cfg.label + '<small>' + cfg.sub + '</small>';
      btn.dataset.level = key;
      btn.onclick = () => {
        sfxClick();
        state.levelKey = key;
        [...levelGrid.children].forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      };
      levelGrid.appendChild(btn);
    });
  }
  buildLevelGrid();

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function buildBoard(){
    const cfg = LEVELS[state.levelKey];
    state.totalPairs = cfg.pairs;
    state.moves = 0;
    state.matchedPairs = 0;
    state.openIndices = [];
    state.locked = false;

    const chosen = shuffle(ANIMAL_POOL).slice(0, cfg.pairs);
    const deck = shuffle([...chosen, ...chosen]).map((symbol, i) => ({ id:i, symbol, flipped:false, matched:false }));
    state.cards = deck;

    cardGrid.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;
    cardGrid.innerHTML = '';
    deck.forEach((card, i) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.style.animationDelay = (i*0.03)+'s';
      el.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">🐾</div>
          <div class="card-face card-front">${card.symbol}</div>
        </div>`;
      el.onclick = () => onCardClick(i);
      cardGrid.appendChild(el);
    });
    updateStats();
  }

  function cardEl(i){ return cardGrid.children[i]; }

  function updateStats(){
    document.getElementById('lblMoves').textContent = state.moves;
    document.getElementById('lblPairs').textContent = state.matchedPairs;
    document.getElementById('lblTotalPairs').textContent = state.totalPairs;
  }

  function onCardClick(i){
    if(state.locked) return;
    const card = state.cards[i];
    if(card.flipped || card.matched) return;

    card.flipped = true;
    cardEl(i).classList.add('flipped');
    sfxFlip();
    state.openIndices.push(i);

    if(state.openIndices.length === 2){
      state.moves++;
      updateStats();
      state.locked = true;
      const [a,b] = state.openIndices;
      if(state.cards[a].symbol === state.cards[b].symbol){
        setTimeout(() => {
          state.cards[a].matched = true;
          state.cards[b].matched = true;
          cardEl(a).classList.add('matched');
          cardEl(b).classList.add('matched');
          sfxMatch();
          state.matchedPairs++;
          updateStats();
          state.openIndices = [];
          state.locked = false;
          if(state.matchedPairs >= state.totalPairs){
            setTimeout(showFinish, 500);
          }
        }, 300);
      } else {
        sfxMismatch();
        cardEl(a).classList.add('shake');
        cardEl(b).classList.add('shake');
        setTimeout(() => {
          state.cards[a].flipped = false;
          state.cards[b].flipped = false;
          cardEl(a).classList.remove('flipped','shake');
          cardEl(b).classList.remove('flipped','shake');
          state.openIndices = [];
          state.locked = false;
        }, 850);
      }
    }
  }

  function showFinish(){
    sfxFinish();
    gameScreen.style.display = 'none';
    finishScreen.style.display = 'flex';
    document.getElementById('finalMoves').textContent = state.moves;

    state.doneLevels.add(state.levelKey);
    const curIdx = LEVEL_ORDER.indexOf(state.levelKey);
    const nextKey = LEVEL_ORDER[curIdx+1];
    const nextBtn = document.getElementById('nextLevelBtn');
    const kicker = document.getElementById('finishKicker');
    const title = document.getElementById('finishTitle');

    if(nextKey){
      kicker.textContent = 'Level ' + LEVELS[state.levelKey].label + ' Selesai!';
      title.textContent = '🎉 Semua pasangan ketemu!';
      nextBtn.hidden = false;
      nextBtn.textContent = 'Lanjut ke Level ' + LEVELS[nextKey].label + ' <i class="bi bi-arrow-right-short"></i>';
      nextBtn.onclick = () => {
        sfxClick();
        state.levelKey = nextKey;
        startGame();
      };
    } else {
      kicker.textContent = 'Semua Level Selesai!';
      title.textContent = '🏆 Kamu Juara Kartu Ingatan!';
      nextBtn.hidden = true;
    }
  }

  function startGame(){
    ensureAudio();
    menuScreen.style.display = 'none';
    finishScreen.style.display = 'none';
    gameScreen.style.display = 'flex';
    buildBoard();
  }
  function backToMenu(){
    gameScreen.style.display = 'none';
    finishScreen.style.display = 'none';
    menuScreen.style.display = 'flex';
    buildLevelGrid();
  }

  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('backBtn').onclick = () => { sfxClick(); backToMenu(); };
  document.getElementById('restartBtn').onclick = () => { sfxClick(); startGame(); };
  document.getElementById('menuBtn2').onclick = () => { sfxClick(); backToMenu(); };
})();
</script>
</body>
</html>
