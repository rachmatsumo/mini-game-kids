<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Labirin Kecil — main-edu</title>
<meta name="theme-color" content="#F7E7BE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7E7BE;
    --paper-dark:#EDD9A3;
    --ink:#5B4630;
    --dim:#8A7256;
    --panel-bg:rgba(255,251,238,.7);
    --gold:#E8A73C;
    --green:#5FAE6B;
    --red:#E85B4E;
    --wall:#6B4A2B;
    --font-display:'Fredoka', sans-serif;
    --font-body:'Nunito', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden;
    background:linear-gradient(165deg, var(--paper) 0%, var(--paper-dark) 100%);
    font-family:var(--font-body); color:var(--ink); touch-action:none;}
  #stage{position:relative; width:100%; height:100vh; min-height:580px; display:flex; flex-direction:column; overflow:hidden;}
  [hidden]{display:none !important;}

  #musicToggle{
    position:absolute; top:14px; right:14px; z-index:30;
    width:40px; height:40px; border-radius:50%;
    background:rgba(91,70,48,.1); border:1px solid rgba(91,70,48,.18);
    color:var(--ink); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, background .15s ease;
  }
  #musicToggle:hover{ background:rgba(91,70,48,.18); }
  #musicToggle:active{ transform:scale(.9); }
  #musicToggle.on{ background:linear-gradient(135deg, var(--green), #3F8E4E); color:#fff; border-color:transparent; }

  /* ---------- MENU ---------- */
  #menuScreen{position:relative; z-index:2; flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px; gap:18px;}
  #menuScreen > *{ animation:menuIn .6s cubic-bezier(.22,.9,.32,1.1) both; }
  #menuScreen > *:nth-child(1){ animation-delay:.05s; }
  #menuScreen > *:nth-child(2){ animation-delay:.16s; }
  #menuScreen > *:nth-child(3){ animation-delay:.27s; }
  #menuScreen > *:nth-child(4){ animation-delay:.38s; }
  @keyframes menuIn{0%{opacity:0; transform:translateY(20px) scale(.97);} 100%{opacity:1; transform:translateY(0) scale(1);}}

  .mascot{position:absolute; top:6%; left:8%; font-size:38px; pointer-events:none;
    animation:bob 4.2s ease-in-out infinite, menuIn .6s ease .5s both;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg);} 50%{transform:translateY(-12px) rotate(6deg);}}

  .kicker{font-family:var(--font-body); font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    font-size:12px; color:#B5762A;}
  h1{font-family:var(--font-display); font-weight:700; font-size:clamp(26px,6vw,42px); margin:6px 0 0; color:var(--ink);}
  .subtitle{color:var(--dim); font-size:15px; max-width:400px; margin:6px auto 0; font-weight:700;}

  .panel{background:var(--panel-bg); border:1px solid rgba(91,70,48,.12); border-radius:20px;
    padding:18px 20px; width:min(92vw,420px); backdrop-filter:blur(6px);
    box-shadow:0 10px 26px rgba(91,70,48,.12);}
  .panel h2{font-family:var(--font-display); font-size:13px; font-weight:600; margin:0 0 12px;
    color:var(--dim); text-transform:uppercase; letter-spacing:.08em; text-align:left;}
  .level-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .level-btn{position:relative; font-family:var(--font-body); font-weight:800; font-size:14px; color:var(--ink);
    background:rgba(255,255,255,.7); border:2px solid rgba(91,70,48,.14); border-radius:14px;
    padding:12px 6px; cursor:pointer; transition:all .15s ease;}
  .level-btn small{display:block; font-weight:700; color:var(--dim); font-size:11px; margin-top:3px;}
  .level-btn:hover{border-color:var(--green); transform:translateY(-1px);}
  .level-btn.active{background:linear-gradient(135deg, var(--green), #3F8E4E); color:#fff; border-color:transparent;
    box-shadow:0 6px 18px rgba(95,174,107,.35);}
  .level-btn.active small{color:#EAFBEA;}
  .level-btn.level-done::after{
    content:'✓'; position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--red); color:#fff; font-size:11px; font-weight:800; display:flex;
    align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.2);
  }

  #startBtn{font-family:var(--font-display); font-weight:600; font-size:18px; color:#3A2400;
    background:linear-gradient(135deg, var(--gold), #D4901E); border:none; border-radius:999px;
    padding:14px 40px; cursor:pointer; box-shadow:0 10px 26px rgba(232,167,60,.4); transition:transform .15s ease;}
  #startBtn:hover{transform:translateY(-2px) scale(1.02);}
  #startBtn:active{transform:translateY(0) scale(.98);}

  /* ---------- GAME ---------- */
  #gameScreen{position:relative; z-index:2; flex:1; display:none; flex-direction:column; min-height:0;}
  #topbar{display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:12px 60px 8px 16px; font-family:var(--font-body); font-weight:800; font-size:13px;
    color:var(--dim); flex-wrap:wrap;}
  #backBtn{background:rgba(91,70,48,.1); border:none; color:var(--ink); font-weight:800;
    border-radius:999px; padding:6px 14px; cursor:pointer; font-family:var(--font-body); font-size:12px;}
  .stat{background:rgba(255,255,255,.65); border-radius:999px; padding:6px 14px;}
  .stat b{color:var(--ink);}
  #resetBtn{background:rgba(255,255,255,.65); border:none; color:var(--ink); font-weight:800;
    border-radius:999px; padding:6px 14px; cursor:pointer; font-family:var(--font-body); font-size:12px;}

  .hint-text{text-align:center; font-size:13px; color:var(--dim); margin:4px 0 8px; font-weight:700;}

  #boardWrap{flex:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:4px 16px 20px;}
  #mazeWrap{ position:relative; }
  #mazeGrid{ position:relative; background:var(--paper);
    border-radius:14px; box-shadow:0 12px 26px rgba(91,70,48,.25), inset 0 0 0 4px var(--wall); overflow:hidden;}
  .cell{ position:absolute; box-sizing:border-box; }
  .trail-dot{ position:absolute; border-radius:50%; background:rgba(232,167,60,.55); pointer-events:none; }
  .goal-emoji{ position:absolute; display:flex; align-items:center; justify-content:center;
    animation:goalPulse 1.4s ease-in-out infinite; pointer-events:none; z-index:3;}
  @keyframes goalPulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.15);}}
  .player{ position:absolute; display:flex; align-items:center; justify-content:center;
    transition:left .16s ease, top .16s ease; z-index:5; filter:drop-shadow(0 4px 4px rgba(0,0,0,.25)); }
  .player.hop{ animation:hopBounce .16s ease; }
  @keyframes hopBounce{ 0%{transform:scale(1);} 50%{transform:scale(1.22,.82);} 100%{transform:scale(1);} }
  .player.bump{ animation:bumpShake .22s ease; }
  @keyframes bumpShake{
    0%,100%{ transform:translateX(0); }
    30%{ transform:translateX(-5px); }
    70%{ transform:translateX(5px); }
  }

  /* ---------- FINISH ---------- */
  #finishScreen{position:relative; z-index:2; flex:1; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; text-align:center; padding:24px;}
  .btn-row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  .secondary-btn{font-family:var(--font-body); font-weight:800; font-size:14px; color:var(--ink);
    background:rgba(255,255,255,.75); border:2px solid rgba(91,70,48,.14); border-radius:999px;
    padding:12px 26px; cursor:pointer;}
  .score-big{font-family:var(--font-display); font-size:44px; font-weight:700; color:#B5762A;}

  @media (prefers-reduced-motion: reduce){
    .mascot{animation:none;}
    #menuScreen > *{animation:menuIn .01s linear both;}
    .goal-emoji{animation:none;}
  }

  .mascot-icon {
    font-size: 32px;
    width: 60px;
    height: 60px;
    border-radius: 20px;
    background: linear-gradient(135deg, #FFC93C, #FF9F1C);
    border: 3px solid #FFF;
    box-shadow: 0 8px 20px rgba(255, 159, 28, 0.4);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #3A2400;
    animation: mascotFloat 3s ease-in-out infinite;
  }
  @keyframes mascotFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }


  .mascot-img-wrap {
    width: 84px;
    height: 84px;
    border-radius: 24px;
    border: 4px solid #FFC93C;
    box-shadow: 0 10px 25px rgba(255, 201, 60, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.6);
    overflow: hidden;
    background: #FFF;
    display: inline-block;
    margin-bottom: 8px;
    animation: mascotFloat 3s ease-in-out infinite;
  }
  .mascot-3d-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  @keyframes mascotFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

<body>
<div id="stage">
  <button id="musicToggle" aria-label="Musik latar"><i class="bi bi-volume-mute-fill"></i></button>

  <!-- MENU -->
  <div id="menuScreen">
    <div class="mascot-img-wrap"><img src="../assets/img/game-thumbnail/app-maze.webp" alt="Game Mascot" class="mascot-3d-img"></div>
    <div class="title-wrap">
      <span class="kicker">Latihan Berpikir Jalur</span>
      <h1>🗺️ Labirin Kecil</h1>
      <p class="subtitle">Bantu si Rubah menemukan harta karun! Seret dia lewat jalan yang terbuka.</p>
    </div>
    <div class="panel">
      <h2>Pilih Level</h2>
      <div class="level-grid" id="levelGrid"></div>
    </div>
    <button id="startBtn">Mulai Petualangan 🧭</button>
  </div>

  <!-- GAME -->
  <div id="gameScreen">
    <div id="topbar">
      <button id="backBtn"><i class="bi bi-arrow-left"></i> Menu</button>
      <div class="stat">Langkah <b id="lblSteps">0</b></div>
      <button id="resetBtn">🔁 Ulang</button>
    </div>
    <p class="hint-text">Seret rubahnya lewat jalan terbuka menuju harta karun 🏆</p>
    <div id="boardWrap"><div id="mazeWrap"><div id="mazeGrid"></div></div></div>
  </div>

  <!-- FINISH -->
  <div id="finishScreen">
    <span class="kicker" id="finishKicker">Selesai!</span>
    <h1 id="finishTitle" style="font-size:clamp(24px,5vw,36px)">🎉 Harta karun ditemukan!</h1>
    <div class="score-big" id="finalSteps">0</div>
    <p class="subtitle">langkah ditempuh</p>
    <div class="btn-row">
      <button class="secondary-btn" id="nextLevelBtn" hidden style="background:linear-gradient(135deg,var(--gold),#D4901E); color:#3A2400; border:none;">Lanjut Level Berikutnya <i class="bi bi-arrow-right-short"></i></button>
    </div>
    <div class="btn-row">
      <button class="secondary-btn" id="restartBtn">🔁 Ulangi Level Ini</button>
      <button class="secondary-btn" id="menuBtn2" style="background:linear-gradient(135deg,var(--green),#3F8E4E); color:#fff; border:none;">🏠 Menu Utama</button>
    </div>
  </div>
</div>

<script>

function submitPortalScore(gameKey, score) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'MAINEDU_SUBMIT_SCORE',
        gameKey: gameKey,
        score: Number(score) || 0
      }, '*');
    }
  } catch(e) {}
}

const CURRENT_GAME_KEY = "maze";
(function(){
  const LEVELS = {
    mudah:  { label:'Mudah',  sub:'5x5', size:5 },
    sedang: { label:'Sedang', sub:'7x7', size:7 },
    sulit:  { label:'Sulit',  sub:'9x9', size:9 },
  };
  const LEVEL_ORDER = ['mudah', 'sedang', 'sulit'];

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const finishScreen = document.getElementById('finishScreen');
  const levelGrid = document.getElementById('levelGrid');
  const mazeGrid = document.getElementById('mazeGrid');

  let state = {
    levelKey: 'mudah',
    doneLevels: new Set(),
    size: 5,
    cellSize: 60,
    cells: [],
    player: { row:0, col:0 },
    steps: 0,
    dragging: false,
    lastHover: null,
    finished: false,
  };

  // ---------- sound effects ----------
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    return audioCtx;
  }

  function withRunningAudio(cb){
    const ctx = ensureAudio();
    if(!ctx) return;
    if(ctx.state === 'running'){ cb(ctx); return; }
    ctx.resume().then(() => cb(ctx)).catch(() => {});
  }

  function unlockAudio(){
    withRunningAudio((ctx) => {
      try {
        const buf = ctx.createBuffer(1, 1, 22050);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(0);
      } catch(e){}
    });
  }
  ['touchstart', 'touchend', 'mousedown', 'pointerdown', 'click'].forEach(evt => {
    window.addEventListener(evt, unlockAudio, { capture: true, passive: true });
  });
  function playTone({freq=440, freqEnd=null, duration=0.12, type='sine', volume=0.15, delay=0}){
    withRunningAudio((ctx) => {
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if(freqEnd !== null){ osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0+duration); }
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(volume, t0+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0+duration+0.03);
    });
  }
  function sfxStep(){ playTone({freq:520, duration:0.05, type:'triangle', volume:0.09}); }
  function sfxBump(){ playTone({freq:220, duration:0.09, type:'square', volume:0.08}); }
  function sfxWin(){ [523,659,784,1046].forEach((f,i)=>playTone({freq:f, duration:0.16, type:'triangle', volume:0.16, delay:i*0.09})); }
  function sfxClick(){ playTone({freq:600, duration:0.05, type:'square', volume:0.06}); }

  // ---------- background music ----------
  let musicOn = false;
  let musicTimer = null;
  let musicGain = null;
  let musicStep = 0;
  const MUSIC_PATTERN = [349.23, null, 392.00, 440.00, null, 392.00, 329.63, null, 349.23, null, null, null];
  const musicToggleBtn = document.getElementById('musicToggle');

  function ensureMusicGain(){
    const ctx = ensureAudio();
    if(!ctx) return null;
    if(!musicGain){
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.0001;
      musicGain.connect(ctx.destination);
    }
    return musicGain;
  }
  function playMusicNote(freq){
    const ctx = ensureAudio();
    const gainBus = ensureMusicGain();
    if(!ctx || !gainBus) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.04, t0+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);
    osc.connect(g).connect(gainBus);
    osc.start(t0);
    osc.stop(t0+0.55);
  }
  function startMusic(){
    const ctx = ensureAudio();
    const gainBus = ensureMusicGain();
    if(!ctx || !gainBus || musicTimer) return;
    gainBus.gain.cancelScheduledValues(ctx.currentTime);
    gainBus.gain.linearRampToValueAtTime(1, ctx.currentTime+0.6);
    musicStep = 0;
    musicTimer = setInterval(()=>{
      const note = MUSIC_PATTERN[musicStep % MUSIC_PATTERN.length];
      if(note) playMusicNote(note);
      musicStep++;
    }, 480);
  }
  function stopMusic(){
    if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
    if(musicGain){
      const ctx = ensureAudio();
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+0.3);
    }
  }
  function updateMusicBtn(){
    musicToggleBtn.textContent = musicOn ? '🔊' : '🔇';
    musicToggleBtn.classList.toggle('on', musicOn);
  }
  musicToggleBtn.onclick = () => {
    musicOn = !musicOn;
    if(musicOn){ ensureAudio(); startMusic(); } else { stopMusic(); }
    updateMusicBtn();
  };

  // ---------- menu ----------
  function buildLevelGrid(){
    levelGrid.innerHTML = '';
    Object.entries(LEVELS).forEach(([key, cfg]) => {
      const btn = document.createElement('button');
      btn.className = 'level-btn' + (key===state.levelKey ? ' active':'') + (state.doneLevels.has(key) ? ' level-done':'');
      btn.innerHTML = cfg.label + '<small>' + cfg.sub + '</small>';
      btn.onclick = () => {
        sfxClick();
        state.levelKey = key;
        [...levelGrid.children].forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      };
      levelGrid.appendChild(btn);
    });
  }
  buildLevelGrid();

  // ---------- maze generation (recursive backtracker) ----------
  function generateMaze(size){
    const cells = Array.from({length:size}, () =>
      Array.from({length:size}, () => ({top:true,right:true,bottom:true,left:true,visited:false})));
    const stack = [[0,0]];
    cells[0][0].visited = true;
    while(stack.length){
      const [r,c] = stack[stack.length-1];
      const options = [];
      if(r>0 && !cells[r-1][c].visited) options.push(['top',r-1,c]);
      if(c<size-1 && !cells[r][c+1].visited) options.push(['right',r,c+1]);
      if(r<size-1 && !cells[r+1][c].visited) options.push(['bottom',r+1,c]);
      if(c>0 && !cells[r][c-1].visited) options.push(['left',r,c-1]);
      if(options.length===0){ stack.pop(); continue; }
      const [dir,nr,nc] = options[Math.floor(Math.random()*options.length)];
      if(dir==='top'){ cells[r][c].top=false; cells[nr][nc].bottom=false; }
      if(dir==='right'){ cells[r][c].right=false; cells[nr][nc].left=false; }
      if(dir==='bottom'){ cells[r][c].bottom=false; cells[nr][nc].top=false; }
      if(dir==='left'){ cells[r][c].left=false; cells[nr][nc].right=false; }
      cells[nr][nc].visited = true;
      stack.push([nr,nc]);
    }
    return cells;
  }

  function buildMazeDOM(){
    const cfg = LEVELS[state.levelKey];
    state.size = cfg.size;
    state.cells = generateMaze(state.size);
    state.player = { row:0, col:0 };
    state.steps = 0;
    state.finished = false;
    updateStats();

    const wrap = document.getElementById('mazeWrap');
    const maxW = Math.min(wrap.parentElement.clientWidth - 20, 380);
    const cellSize = Math.floor(maxW / state.size);
    state.cellSize = cellSize;
    const totalSize = cellSize * state.size;

    mazeGrid.style.width = totalSize + 'px';
    mazeGrid.style.height = totalSize + 'px';
    mazeGrid.innerHTML = '';

    const wallPx = Math.max(3, Math.round(cellSize * 0.07));

    for(let r=0;r<state.size;r++){
      for(let c=0;c<state.size;c++){
        const cell = state.cells[r][c];
        const div = document.createElement('div');
        div.className = 'cell';
        div.style.left = (c*cellSize)+'px';
        div.style.top = (r*cellSize)+'px';
        div.style.width = cellSize+'px';
        div.style.height = cellSize+'px';
        div.style.borderTop = cell.top ? wallPx+'px solid var(--wall)' : 'none';
        div.style.borderRight = cell.right ? wallPx+'px solid var(--wall)' : 'none';
        div.style.borderBottom = cell.bottom ? wallPx+'px solid var(--wall)' : 'none';
        div.style.borderLeft = cell.left ? wallPx+'px solid var(--wall)' : 'none';
        mazeGrid.appendChild(div);
      }
    }

    // goal marker
    const goal = document.createElement('div');
    goal.className = 'goal-emoji';
    goal.id = 'goalEmoji';
    goal.textContent = '🏆';
    goal.style.width = cellSize+'px';
    goal.style.height = cellSize+'px';
    goal.style.left = ((state.size-1)*cellSize)+'px';
    goal.style.top = ((state.size-1)*cellSize)+'px';
    goal.style.fontSize = (cellSize*0.55)+'px';
    mazeGrid.appendChild(goal);

    // player
    const player = document.createElement('div');
    player.className = 'player';
    player.id = 'playerEl';
    player.textContent = '🦊';
    player.style.width = cellSize+'px';
    player.style.height = cellSize+'px';
    player.style.left = '0px';
    player.style.top = '0px';
    player.style.fontSize = (cellSize*0.55)+'px';
    mazeGrid.appendChild(player);

    // trail dot at start
    addTrailDot(0,0);
  }

  function addTrailDot(row, col){
    const cs = state.cellSize;
    const dot = document.createElement('div');
    dot.className = 'trail-dot';
    const size = cs*0.22;
    dot.style.width = size+'px';
    dot.style.height = size+'px';
    dot.style.left = (col*cs + cs/2 - size/2)+'px';
    dot.style.top = (row*cs + cs/2 - size/2)+'px';
    mazeGrid.insertBefore(dot, document.getElementById('goalEmoji'));
  }

  function updateStats(){
    document.getElementById('lblSteps').textContent = state.steps;
  }

  function movePlayerTo(row, col){
    const cs = state.cellSize;
    const player = document.getElementById('playerEl');
    player.style.left = (col*cs)+'px';
    player.style.top = (row*cs)+'px';
    player.classList.remove('hop');
    void player.offsetWidth;
    player.classList.add('hop');
  }

  function bumpFeedback(){
    const player = document.getElementById('playerEl');
    player.classList.remove('bump');
    void player.offsetWidth;
    player.classList.add('bump');
    sfxBump();
  }

  function canMove(fromR, fromC, toR, toC){
    const dr = toR-fromR, dc = toC-fromC;
    const cell = state.cells[fromR][fromC];
    if(dr===-1 && dc===0) return !cell.top;
    if(dr===1 && dc===0) return !cell.bottom;
    if(dr===0 && dc===-1) return !cell.left;
    if(dr===0 && dc===1) return !cell.right;
    return false;
  }

  function attemptMove(row, col){
    if(state.finished) return;
    if(row<0||col<0||row>=state.size||col>=state.size) return;
    const { row: pr, col: pc } = state.player;
    if(row===pr && col===pc) return;
    const dist = Math.abs(row-pr)+Math.abs(col-pc);
    if(dist !== 1) return;
    if(!canMove(pr,pc,row,col)){ bumpFeedback(); return; }

    state.player = { row, col };
    state.steps++;
    updateStats();
    movePlayerTo(row, col);
    addTrailDot(row, col);
    sfxStep();

    if(row === state.size-1 && col === state.size-1){
      state.finished = true;
      setTimeout(onWin, 350);
    }
  }

  function hoveredCell(clientX, clientY){
    const rect = mazeGrid.getBoundingClientRect();
    const col = Math.floor((clientX-rect.left)/state.cellSize);
    const row = Math.floor((clientY-rect.top)/state.cellSize);
    return { row, col };
  }

  mazeGrid.addEventListener('pointerdown', (e) => {
    state.dragging = true;
    const { row, col } = hoveredCell(e.clientX, e.clientY);
    state.lastHover = row+','+col;
    attemptMove(row, col);
    e.preventDefault();
  });
  mazeGrid.addEventListener('pointermove', (e) => {
    if(!state.dragging) return;
    const { row, col } = hoveredCell(e.clientX, e.clientY);
    const key = row+','+col;
    if(key === state.lastHover) return;
    state.lastHover = key;
    attemptMove(row, col);
  });
  window.addEventListener('pointerup', () => { state.dragging = false; });
  mazeGrid.addEventListener('pointercancel', () => { state.dragging = false; });

  function onWin(){
    sfxWin();
    gameScreen.style.display = 'none';
    finishScreen.style.display = 'flex';
    document.getElementById('finalSteps').textContent = state.steps;

    // Calculate score points for maze
    const baseScore = state.size * 25;
    const stepPenalty = Math.max(0, state.steps - state.size * 2) * 2;
    const finalScore = Math.max(30, baseScore - stepPenalty);

    submitPortalScore("maze", finalScore);

    state.doneLevels.add(state.levelKey);
    const curIdx = LEVEL_ORDER.indexOf(state.levelKey);
    const nextKey = LEVEL_ORDER[curIdx+1];
    const nextBtn = document.getElementById('nextLevelBtn');
    const kicker = document.getElementById('finishKicker');
    const title = document.getElementById('finishTitle');

    if(nextKey){
      kicker.textContent = 'Level ' + LEVELS[state.levelKey].label + ' Selesai!';
      title.textContent = '🎉 Harta karun ditemukan!';
      nextBtn.hidden = false;
      nextBtn.textContent = 'Lanjut ke Level ' + LEVELS[nextKey].label + ' <i class="bi bi-arrow-right-short"></i>';
      nextBtn.onclick = () => { sfxClick(); state.levelKey = nextKey; startGame(); };
    } else {
      kicker.textContent = 'Semua Level Selesai!';
      title.textContent = '<i class="bi bi-trophy-fill" style="color:#FFC93C"></i> Kamu Jago Labirin!';
      nextBtn.hidden = true;
    }
  }

  function startGame(){
    ensureAudio();
    menuScreen.style.display = 'none';
    finishScreen.style.display = 'none';
    gameScreen.style.display = 'flex';
    requestAnimationFrame(buildMazeDOM);
  }
  function backToMenu(){
    gameScreen.style.display = 'none';
    finishScreen.style.display = 'none';
    menuScreen.style.display = 'flex';
    buildLevelGrid();
  }

  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('backBtn').onclick = () => { sfxClick(); backToMenu(); };
  document.getElementById('resetBtn').onclick = () => {
    sfxClick();
    state.player = { row:0, col:0 };
    state.steps = 0;
    state.finished = false;
    updateStats();
    mazeGrid.querySelectorAll('.trail-dot').forEach(el=>el.remove());
    movePlayerTo(0,0);
    addTrailDot(0,0);
  };
  document.getElementById('restartBtn').onclick = () => { sfxClick(); startGame(); };
  document.getElementById('menuBtn2').onclick = () => { sfxClick(); backToMenu(); };

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if(gameScreen.style.display === 'flex') buildMazeDOM();
    }, 250);
  });
})();
</script>
</body>
</html>
