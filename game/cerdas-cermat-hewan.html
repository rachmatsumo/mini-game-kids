<html lang="id">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#2E1F63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg-top:#2E1F63;
    --bg-bottom:#4A2E8C;
    --ink:#F5F0FF;
    --dim:#C9BFE8;
    --panel-bg:rgba(255,255,255,.1);
    --gold:#FFC93C;
    --coral:#FF6F59;
    --teal:#3FBFAE;
    --pink:#FF8FC0;
    --font-display:'Fredoka', sans-serif;
    --font-body:'Nunito', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden;
    background:radial-gradient(ellipse at 50% -10%, var(--bg-bottom) 0%, var(--bg-top) 65%);
    font-family:var(--font-body); color:var(--ink);}
  #stage{position:relative; width:100%; height:100vh; min-height:580px; display:flex; flex-direction:column; overflow:hidden;}
  [hidden]{display:none !important;}

  .spark{ position:absolute; background:#fff; border-radius:50%; opacity:.35; animation:twinkle 4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.1;} 50%{opacity:.5;}}

  #musicToggle{
    position:absolute; top:14px; right:14px; z-index:30;
    width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18);
    color:var(--ink); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, background .15s ease;
  }
  #musicToggle:hover{ background:rgba(255,255,255,.18); }
  #musicToggle:active{ transform:scale(.9); }
  #musicToggle.on{ background:linear-gradient(135deg, var(--gold), #E0A93A); color:#3A2400; border-color:transparent; }

  /* ---------- MENU ---------- */
  #menuScreen{position:relative; z-index:2; flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px; gap:18px;}
  #menuScreen > *{ animation:menuIn .6s cubic-bezier(.22,.9,.32,1.1) both; }
  #menuScreen > *:nth-child(1){ animation-delay:.05s; }
  #menuScreen > *:nth-child(2){ animation-delay:.16s; }
  #menuScreen > *:nth-child(3){ animation-delay:.27s; }
  #menuScreen > *:nth-child(4){ animation-delay:.38s; }
  @keyframes menuIn{0%{opacity:0; transform:translateY(20px) scale(.97);} 100%{opacity:1; transform:translateY(0) scale(1);}}

  .mascot{position:absolute; top:6%; left:8%; font-size:38px; pointer-events:none;
    animation:bob 4.2s ease-in-out infinite, menuIn .6s ease .5s both;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg);} 50%{transform:translateY(-12px) rotate(6deg);}}

  .kicker{font-family:var(--font-body); font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    font-size:12px; color:var(--gold);}
  h1{font-family:var(--font-display); font-weight:700; font-size:clamp(26px,6vw,42px); margin:6px 0 0; color:#fff;}
  .subtitle{color:var(--dim); font-size:15px; max-width:400px; margin:6px auto 0; font-weight:700;}

  .panel{background:var(--panel-bg); border:1px solid rgba(255,255,255,.14); border-radius:20px;
    padding:18px 20px; width:min(92vw,420px); backdrop-filter:blur(6px);
    box-shadow:0 10px 26px rgba(0,0,0,.25);}
  .panel h2{font-family:var(--font-display); font-size:13px; font-weight:600; margin:0 0 12px;
    color:var(--dim); text-transform:uppercase; letter-spacing:.08em; text-align:left;}
  .level-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .level-btn{position:relative; font-family:var(--font-body); font-weight:800; font-size:14px; color:#fff;
    background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.16); border-radius:14px;
    padding:12px 6px; cursor:pointer; transition:all .15s ease;}
  .level-btn small{display:block; font-weight:700; color:var(--dim); font-size:11px; margin-top:3px;}
  .level-btn:hover{border-color:var(--gold); transform:translateY(-1px);}
  .level-btn.active{background:linear-gradient(135deg, var(--gold), #E0A93A); color:#3A2400; border-color:transparent;
    box-shadow:0 6px 18px rgba(255,201,60,.35);}
  .level-btn.active small{color:#5A3E00;}
  .level-btn.level-done::after{
    content:'✓'; position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--coral); color:#fff; font-size:11px; font-weight:800; display:flex;
    align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.3);
  }

  #startBtn{font-family:var(--font-display); font-weight:600; font-size:18px; color:#3A2400;
    background:linear-gradient(135deg, var(--gold), #E0A93A); border:none; border-radius:999px;
    padding:14px 40px; cursor:pointer; box-shadow:0 10px 26px rgba(255,201,60,.4); transition:transform .15s ease;}
  #startBtn:hover{transform:translateY(-2px) scale(1.02);}
  #startBtn:active{transform:translateY(0) scale(.98);}

  /* ---------- GAME ---------- */
  #gameScreen{position:relative; z-index:2; flex:1; display:none; flex-direction:column; min-height:0;}
  #topbar{display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:12px 60px 8px 16px; font-family:var(--font-body); font-weight:800; font-size:13px;
    color:var(--dim); flex-wrap:wrap;}
  #backBtn{background:rgba(255,255,255,.1); border:none; color:#fff; font-weight:800;
    border-radius:999px; padding:6px 14px; cursor:pointer; font-family:var(--font-body); font-size:12px;}
  .stat{background:rgba(255,255,255,.1); border-radius:999px; padding:6px 14px;}
  .stat b{color:#fff;}

  #questionArea{ padding:10px 18px 6px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  #questionCard{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:18px;
    padding:16px 18px; width:min(94vw,440px); text-align:center; display:flex; flex-direction:column; gap:10px;
  }
  #questionText{ font-family:var(--font-display); font-weight:600; font-size:clamp(16px,4.4vw,21px); color:#fff; line-height:1.35; }
  #replayBtn{
    align-self:center; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #FFE9B0, var(--gold)); font-size:20px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 14px rgba(255,201,60,.35);
    position:relative;
  }
  #replayBtn .ring{ position:absolute; inset:-8px; border-radius:50%; border:3px solid rgba(255,201,60,.6); opacity:0; }
  #replayBtn.playing .ring{ animation:ringPulse .9s ease-out; }
  @keyframes ringPulse{ 0%{ opacity:.9; transform:scale(.85);} 100%{ opacity:0; transform:scale(1.35);} }

  #choicesGrid{display:grid; gap:14px; padding:14px 20px 20px; flex:1; align-content:center;
    width:min(92vw,440px); margin:0 auto;}
  .choice-btn{
    border:none; border-radius:20px; cursor:pointer; font-size:clamp(34px,9vw,48px);
    background:rgba(255,255,255,.1); box-shadow:0 8px 18px rgba(0,0,0,.25);
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease;
  }
  .choice-btn:active{ transform:scale(.94); }
  .choice-btn.correct{ background:linear-gradient(155deg, #C9F2D6, #8FE0A8); box-shadow:0 0 0 3px var(--teal), 0 10px 20px rgba(63,191,174,.35); animation:correctPulse .5s ease; }
  .choice-btn.wrong{ background:linear-gradient(155deg, #FFD3CB, #FFAFA0); animation:shakeChoice .4s ease; }
  @keyframes correctPulse{0%{transform:scale(1);} 40%{transform:scale(1.1);} 100%{transform:scale(1);}}
  @keyframes shakeChoice{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}

  /* ---------- FINISH ---------- */
  #finishScreen{position:relative; z-index:2; flex:1; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; text-align:center; padding:24px;}
  .btn-row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  .secondary-btn{font-family:var(--font-body); font-weight:800; font-size:14px; color:#fff;
    background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.18); border-radius:999px;
    padding:12px 26px; cursor:pointer;}
  .score-big{font-family:var(--font-display); font-size:44px; font-weight:700; color:var(--gold);}

  @media (prefers-reduced-motion: reduce){
    .mascot{animation:none;}
    #menuScreen > *{animation:menuIn .01s linear both;}
    .spark{animation:none;}
  }

  .mascot-icon {
    font-size: 32px;
    width: 60px;
    height: 60px;
    border-radius: 20px;
    background: linear-gradient(135deg, #FFC93C, #FF9F1C);
    border: 3px solid #FFF;
    box-shadow: 0 8px 20px rgba(255, 159, 28, 0.4);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #3A2400;
    animation: mascotFloat 3s ease-in-out infinite;
  }
  @keyframes mascotFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }


  .mascot-img-wrap {
    width: 84px;
    height: 84px;
    border-radius: 24px;
    border: 4px solid #FFC93C;
    box-shadow: 0 10px 25px rgba(255, 201, 60, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.6);
    overflow: hidden;
    background: #FFF;
    display: inline-block;
    margin-bottom: 8px;
    animation: mascotFloat 3s ease-in-out infinite;
  }
  .mascot-3d-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  @keyframes mascotFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

</style>

<body>
<div id="stage">
  <div id="sparkLayer"></div>
  <button id="musicToggle" aria-label="Musik latar"><i class="bi bi-volume-mute-fill"></i></button>

  <!-- MENU -->
  <div id="menuScreen">
    <div class="mascot-img-wrap"><img src="../assets/img/game-thumbnail/app-quiz.png" alt="Game Mascot" class="mascot-3d-img"></div>
    <div class="title-wrap">
      <span class="kicker">Kuis Pengetahuan Hewan</span>
      <h1><i class="bi bi-lightbulb-fill" style="color:#FFC93C"></i> Cerdas Cermat Hewan</h1>
      <p class="subtitle">Dengarkan pertanyaannya, lalu tap gambar hewan yang jawabannya benar!</p>
    </div>
    <div class="panel">
      <h2>Pilih Level</h2>
      <div class="level-grid" id="levelGrid"></div>
    </div>
    <button id="startBtn">Mulai Kuis <i class="bi bi-trophy-fill" style="color:#FFC93C"></i></button>
  </div>

  <!-- GAME -->
  <div id="gameScreen">
    <div id="topbar">
      <button id="backBtn"><i class="bi bi-arrow-left"></i> Menu</button>
      <div class="stat">Percobaan <b id="lblMoves">0</b></div>
      <div class="stat">Benar <b id="lblCorrect">0</b>/<span id="lblTotal">0</span></div>
    </div>
    <div id="questionArea">
      <div id="questionCard">
        <div id="questionText">Memuat pertanyaan...</div>
        <button id="replayBtn"><span class="ring"></span><i class="bi bi-volume-up-fill"></i></button>
      </div>
    </div>
    <div id="choicesGrid"></div>
  </div>

  <!-- FINISH -->
  <div id="finishScreen">
    <span class="kicker" id="finishKicker">Selesai!</span>
    <h1 id="finishTitle" style="font-size:clamp(24px,5vw,36px)"><i class="bi bi-stars" style="color:#FFC93C"></i> Semua Pertanyaan Terjawab!</h1>
    <div class="score-big" id="finalMoves">0</div>
    <p class="subtitle">kali percobaan</p>
    <div class="btn-row">
      <button class="secondary-btn" id="nextLevelBtn" hidden style="background:linear-gradient(135deg,var(--gold),#E0A93A); color:#3A2400; border:none;">Lanjut Level Berikutnya <i class="bi bi-arrow-right-short"></i></button>
    </div>
    <div class="btn-row">
      <button class="secondary-btn" id="restartBtn">🔁 Ulangi Level Ini</button>
      <button class="secondary-btn" id="menuBtn2" style="background:linear-gradient(135deg,var(--teal),#2A9C8D); color:#fff; border:none;">🏠 Menu Utama</button>
    </div>
  </div>
</div>

<script>
function submitPortalScore(gameKey, score) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'MAINEDU_SUBMIT_SCORE',
        gameKey: gameKey,
        score: Number(score) || 0
      }, '*');
    }
  } catch(e) {}
}
const CURRENT_GAME_KEY = "quiz";

(function(){
  const QUESTION_BANK = {
    mudah: [
      { q:'Hewan apa yang makan rumput?', correct:{e:'🐐',n:'Kambing'}, wrong:[{e:'🦁',n:'Singa'}] },
      { q:'Hewan apa yang bisa terbang?', correct:{e:'🐦',n:'Burung'}, wrong:[{e:'🐘',n:'Gajah'}] },
      { q:'Hewan apa yang hidup di air?', correct:{e:'🐟',n:'Ikan'}, wrong:[{e:'🐯',n:'Harimau'}] },
      { q:'Hewan apa yang punya belalai panjang?', correct:{e:'🐘',n:'Gajah'}, wrong:[{e:'🐰',n:'Kelinci'}] },
      { q:'Hewan apa yang suka makan wortel?', correct:{e:'🐰',n:'Kelinci'}, wrong:[{e:'🦈',n:'Hiu'}] },
      { q:'Hewan apa yang punya leher sangat panjang?', correct:{e:'🦒',n:'Jerapah'}, wrong:[{e:'🐸',n:'Katak'}] },
    ],
    sedang: [
      { q:'Hewan apa yang termasuk karnivora, pemakan daging?', correct:{e:'🦁',n:'Singa'}, wrong:[{e:'🐐',n:'Kambing'},{e:'🐰',n:'Kelinci'}] },
      { q:'Hewan apa yang berenang menggunakan sirip?', correct:{e:'🐬',n:'Lumba-lumba'}, wrong:[{e:'🐔',n:'Ayam'},{e:'🐿️',n:'Tupai'}] },
      { q:'Hewan apa yang punya cangkang keras di punggungnya?', correct:{e:'🐢',n:'Kura-kura'}, wrong:[{e:'🐕',n:'Anjing'},{e:'🐴',n:'Kuda'}] },
      { q:'Hewan apa yang aktif di malam hari?', correct:{e:'🦉',n:'Burung Hantu'}, wrong:[{e:'🐓',n:'Ayam Jantan'},{e:'🦆',n:'Bebek'}] },
      { q:'Hewan apa yang punya kantung di perutnya untuk anaknya?', correct:{e:'🦘',n:'Kanguru'}, wrong:[{e:'🐖',n:'Babi'},{e:'🐄',n:'Sapi'}] },
      { q:'Hewan apa yang bisa mengubah warna kulitnya?', correct:{e:'🦎',n:'Bunglon'}, wrong:[{e:'🐁',n:'Tikus'},{e:'🐑',n:'Domba'}] },
    ],
    sulit: [
      { q:'Hewan apa yang merupakan mamalia terbesar di lautan?', correct:{e:'🐋',n:'Paus'}, wrong:[{e:'🦈',n:'Hiu'},{e:'🐬',n:'Lumba-lumba'},{e:'🐢',n:'Kura-kura'}] },
      { q:'Hewan apa yang bisa hidup di darat dan di air?', correct:{e:'🐸',n:'Katak'}, wrong:[{e:'🦎',n:'Kadal'},{e:'🐟',n:'Ikan'},{e:'🐦',n:'Burung'}] },
      { q:'Hewan apa yang termasuk kelompok serangga?', correct:{e:'🐝',n:'Lebah'}, wrong:[{e:'🕷️',n:'Laba-laba'},{e:'🦂',n:'Kalajengking'},{e:'🐌',n:'Siput'}] },
      { q:'Hewan apa yang berburu terbang di malam hari?', correct:{e:'🦇',n:'Kelelawar'}, wrong:[{e:'🐓',n:'Ayam'},{e:'🦚',n:'Merak'},{e:'🐿️',n:'Tupai'}] },
      { q:'Hewan apa yang bersisik dan tidak punya kaki?', correct:{e:'🐍',n:'Ular'}, wrong:[{e:'🐛',n:'Ulat'},{e:'🦎',n:'Kadal'},{e:'🪱',n:'Cacing'}] },
      { q:'Hewan apa yang dijuluki raja hutan?', correct:{e:'🦁',n:'Singa'}, wrong:[{e:'🐯',n:'Harimau'},{e:'🐆',n:'Macan Tutul'},{e:'🐻',n:'Beruang'}] },
      { q:'Hewan berkaki delapan apa yang menenun jaring?', correct:{e:'🕷️',n:'Laba-laba'}, wrong:[{e:'🦂',n:'Kalajengking'},{e:'🐜',n:'Semut'},{e:'🦗',n:'Belalang'}] },
    ],
  };
  const LEVELS = {
    mudah:  { label:'Mudah',  sub:'2 pilihan' },
    sedang: { label:'Sedang', sub:'3 pilihan' },
    sulit:  { label:'Sulit',  sub:'4 pilihan' },
  };
  const LEVEL_ORDER = ['mudah', 'sedang', 'sulit'];

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const finishScreen = document.getElementById('finishScreen');
  const levelGrid = document.getElementById('levelGrid');
  const choicesGrid = document.getElementById('choicesGrid');
  const questionText = document.getElementById('questionText');
  const replayBtn = document.getElementById('replayBtn');

  let state = {
    levelKey: 'mudah',
    order: [],
    roundIdx: 0,
    totalRounds: 6,
    correctCount: 0,
    moves: 0,
    doneLevels: new Set(),
    current: null,
    locked: false,
  };

  // ---------- sound effects ----------
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTone({freq=440, freqEnd=null, duration=0.12, type='sine', volume=0.15, delay=0}){
    const ctx = ensureAudio();
    if(!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(freqEnd !== null){ osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0+duration); }
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(volume, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+duration+0.03);
  }
  function sfxCorrect(){ [660,880,1108].forEach((f,i)=>playTone({freq:f, duration:0.14, type:'triangle', volume:0.15, delay:i*0.08})); }
  function sfxWrong(){ playTone({freq:300, duration:0.12, type:'sine', volume:0.1}); playTone({freq:220, duration:0.18, type:'sine', volume:0.1, delay:0.1}); }
  function sfxFinish(){ [523,659,784,1046].forEach((f,i)=>playTone({freq:f, duration:0.16, type:'triangle', volume:0.16, delay:i*0.09})); }
  function sfxClick(){ playTone({freq:600, duration:0.05, type:'square', volume:0.06}); }
  function sfxChime(){ playTone({freq:880, duration:0.09, type:'sine', volume:0.08}); }

  // ---------- question narration (TTS with text always shown as fallback) ----------
  function ttsAvailable(){
    return typeof window !== 'undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
  }
  function speakQuestion(text){
    replayBtn.classList.remove('playing');
    void replayBtn.offsetWidth;
    replayBtn.classList.add('playing');
    sfxChime();
    if(!ttsAvailable()) return;
    try{
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'id-ID';
      utter.rate = 0.92;
      utter.pitch = 1.05;
      utter.volume = 1;
      window.speechSynthesis.speak(utter);
    }catch(e){ /* text is already shown on screen as fallback */ }
  }

  // ---------- background music ----------
  let musicOn = false;
  let musicTimer = null;
  let musicGain = null;
  let musicStep = 0;
  const MUSIC_PATTERN = [440.00, null, 523.25, 587.33, null, 523.25, 440.00, null, 392.00, null, null, null];
  const musicToggleBtn = document.getElementById('musicToggle');

  function ensureMusicGain(){
    const ctx = ensureAudio();
    if(!ctx) return null;
    if(!musicGain){
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.0001;
      musicGain.connect(ctx.destination);
    }
    return musicGain;
  }
  function playMusicNote(freq){
    const ctx = ensureAudio();
    const gainBus = ensureMusicGain();
    if(!ctx || !gainBus) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.04, t0+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);
    osc.connect(g).connect(gainBus);
    osc.start(t0);
    osc.stop(t0+0.55);
  }
  function startMusic(){
    const ctx = ensureAudio();
    const gainBus = ensureMusicGain();
    if(!ctx || !gainBus || musicTimer) return;
    gainBus.gain.cancelScheduledValues(ctx.currentTime);
    gainBus.gain.linearRampToValueAtTime(1, ctx.currentTime+0.6);
    musicStep = 0;
    musicTimer = setInterval(()=>{
      const note = MUSIC_PATTERN[musicStep % MUSIC_PATTERN.length];
      if(note) playMusicNote(note);
      musicStep++;
    }, 470);
  }
  function stopMusic(){
    if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
    if(musicGain){
      const ctx = ensureAudio();
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+0.3);
    }
  }
  function updateMusicBtn(){
    musicToggleBtn.textContent = musicOn ? '🔊' : '🔇';
    musicToggleBtn.classList.toggle('on', musicOn);
  }
  musicToggleBtn.onclick = () => {
    musicOn = !musicOn;
    if(musicOn){ ensureAudio(); startMusic(); } else { stopMusic(); }
    updateMusicBtn();
  };

  // ---------- decorative sparks ----------
  const sparkLayer = document.getElementById('sparkLayer');
  for(let i=0;i<30;i++){
    const s = document.createElement('div');
    s.className='spark';
    const size = Math.random()*2+1;
    s.style.width = s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*4)+'s';
    sparkLayer.appendChild(s);
  }

  // ---------- menu ----------
  function buildLevelGrid(){
    levelGrid.innerHTML = '';
    Object.entries(LEVELS).forEach(([key, cfg]) => {
      const btn = document.createElement('button');
      btn.className = 'level-btn' + (key===state.levelKey ? ' active':'') + (state.doneLevels.has(key) ? ' level-done':'');
      btn.innerHTML = cfg.label + '<small>' + cfg.sub + '</small>';
      btn.onclick = () => {
        sfxClick();
        state.levelKey = key;
        [...levelGrid.children].forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      };
      levelGrid.appendChild(btn);
    });
  }
  buildLevelGrid();

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function updateStats(){
    document.getElementById('lblMoves').textContent = state.moves;
    document.getElementById('lblCorrect').textContent = state.correctCount;
    document.getElementById('lblTotal').textContent = state.totalRounds;
  }

  function buildRound(){
    state.current = state.order[state.roundIdx];
    state.locked = false;
    questionText.textContent = state.current.q;

    const options = shuffle([state.current.correct, ...state.current.wrong]);
    choicesGrid.style.gridTemplateColumns = 'repeat(' + Math.min(options.length,4) + ',1fr)';
    choicesGrid.innerHTML = '';
    options.forEach(animal => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = animal.e;
      btn.onclick = () => onChoose(animal, btn);
      choicesGrid.appendChild(btn);
    });

    updateStats();
    setTimeout(() => speakQuestion(state.current.q), 300);
  }

  function onChoose(animal, btn){
    if(state.locked) return;
    state.moves++;
    updateStats();
    if(animal.e === state.current.correct.e){
      state.locked = true;
      btn.classList.add('correct');
      sfxCorrect();
      state.correctCount++;
      updateStats();
      setTimeout(() => {
        state.roundIdx++;
        if(state.roundIdx >= state.totalRounds){
          showFinish();
        } else {
          buildRound();
        }
      }, 1000);
    } else {
      btn.classList.add('wrong');
      sfxWrong();
      setTimeout(() => btn.classList.remove('wrong'), 420);
    }
  }

  replayBtn.onclick = () => { if(state.current) speakQuestion(state.current.q); };

  function showFinish(){
    sfxFinish();
    gameScreen.style.display = 'none';
    finishScreen.style.display = 'flex';
    document.getElementById('finalMoves').textContent = state.moves;

    const levelMultiplier = state.levelKey === 'sulit' ? 30 : (state.levelKey === 'sedang' ? 20 : 10);
    const accuracyBonus = Math.max(0, (state.totalRounds * 2) - state.moves) * 5;
    const earnedScore = (state.totalRounds * levelMultiplier) + accuracyBonus;
    submitPortalScore("quiz", earnedScore);

    state.doneLevels.add(state.levelKey);
    const curIdx = LEVEL_ORDER.indexOf(state.levelKey);
    const nextKey = LEVEL_ORDER[curIdx+1];
    const nextBtn = document.getElementById('nextLevelBtn');
    const kicker = document.getElementById('finishKicker');
    const title = document.getElementById('finishTitle');

    if(nextKey){
      kicker.textContent = 'Level ' + LEVELS[state.levelKey].label + ' Selesai!';
      title.textContent = '<i class="bi bi-stars" style="color:#FFC93C"></i> Semua Pertanyaan Terjawab!';
      nextBtn.hidden = false;
      nextBtn.textContent = 'Lanjut ke Level ' + LEVELS[nextKey].label + ' <i class="bi bi-arrow-right-short"></i>';
      nextBtn.onclick = () => { sfxClick(); state.levelKey = nextKey; startGame(); };
    } else {
      kicker.textContent = 'Semua Level Selesai!';
      title.textContent = '<i class="bi bi-trophy-fill" style="color:#FFC93C"></i> Kamu Jago Cerdas Cermat Hewan!';
      nextBtn.hidden = true;
    }
  }

  function startGame(){
    ensureAudio();
    const pool = QUESTION_BANK[state.levelKey];
    state.order = shuffle(pool);
    state.totalRounds = state.order.length;
    state.roundIdx = 0;
    state.correctCount = 0;
    state.moves = 0;
    menuScreen.style.display = 'none';
    finishScreen.style.display = 'none';
    gameScreen.style.display = 'flex';
    buildRound();
  }
  function backToMenu(){
    if(ttsAvailable()) window.speechSynthesis.cancel();
    gameScreen.style.display = 'none';
    finishScreen.style.display = 'none';
    menuScreen.style.display = 'flex';
    buildLevelGrid();
  }

  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('backBtn').onclick = () => { sfxClick(); backToMenu(); };
  document.getElementById('restartBtn').onclick = () => { sfxClick(); startGame(); };
  document.getElementById('menuBtn2').onclick = () => { sfxClick(); backToMenu(); };
})();
</script>
</body>
</html>
