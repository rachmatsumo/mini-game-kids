<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Loncat Pipa Emas — main-edu</title>
<meta name="theme-color" content="#5EC8F2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#5EC8F2;
    --sky-bottom:#BDEBFF;
    --ink:#1B2A4A;
    --dim:#4A6285;
    --panel-bg:rgba(255,255,255,.68);
    --red:#E8433A;
    --yellow:#FFC93C;
    --green:#2FAE4E;
    --green-dark:#17692C;
    --blue:#3C6FE0;
    --font-display:'Fredoka', sans-serif;
    --font-body:'Nunito', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden;
    background:linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    font-family:var(--font-body); color:var(--ink);}
  #stage{position:relative; width:100%; height:100vh; min-height:580px; display:flex; flex-direction:column; overflow:hidden;}
  [hidden]{display:none !important;}

  #musicToggle{
    position:absolute; top:14px; right:14px; z-index:40;
    width:40px; height:40px; border-radius:50%;
    background:rgba(27,42,74,.12); border:1px solid rgba(27,42,74,.18);
    color:var(--ink); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, background .15s ease;
  }
  #musicToggle:hover{ background:rgba(27,42,74,.2); }
  #musicToggle:active{ transform:scale(.9); }
  #musicToggle.on{ background:linear-gradient(135deg, var(--yellow), #F0A93A); color:#3A2400; border-color:transparent; }

  /* ---------- MENU ---------- */
  #menuScreen{position:relative; z-index:2; flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px; gap:18px;}
  #menuScreen > *{ animation:menuIn .6s cubic-bezier(.22,.9,.32,1.1) both; }
  #menuScreen > *:nth-child(1){ animation-delay:.05s; }
  #menuScreen > *:nth-child(2){ animation-delay:.16s; }
  #menuScreen > *:nth-child(3){ animation-delay:.27s; }
  #menuScreen > *:nth-child(4){ animation-delay:.38s; }
  @keyframes menuIn{0%{opacity:0; transform:translateY(20px) scale(.97);} 100%{opacity:1; transform:translateY(0) scale(1);}}

  .mascot{position:absolute; top:6%; left:8%; font-size:38px; pointer-events:none;
    animation:bob 4.2s ease-in-out infinite, menuIn .6s ease .5s both;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg);} 50%{transform:translateY(-12px) rotate(6deg);}}

  .kicker{font-family:var(--font-body); font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    font-size:12px; color:#C23A2E;}
  h1{font-family:var(--font-display); font-weight:700; font-size:clamp(26px,6vw,42px); margin:6px 0 0; color:var(--ink);
    text-shadow:0 2px 0 rgba(255,255,255,.5);}
  .subtitle{color:var(--dim); font-size:15px; max-width:400px; margin:6px auto 0; font-weight:700;}

  .panel{background:var(--panel-bg); border:1px solid rgba(27,42,74,.1); border-radius:20px;
    padding:18px 20px; width:min(92vw,420px); backdrop-filter:blur(6px);
    box-shadow:0 10px 26px rgba(27,42,74,.12);}
  .panel h2{font-family:var(--font-display); font-size:13px; font-weight:600; margin:0 0 12px;
    color:var(--dim); text-transform:uppercase; letter-spacing:.08em; text-align:left;}
  .level-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .level-btn{position:relative; font-family:var(--font-body); font-weight:800; font-size:14px; color:var(--ink);
    background:rgba(255,255,255,.75); border:2px solid rgba(27,42,74,.12); border-radius:14px;
    padding:12px 6px; cursor:pointer; transition:all .15s ease;}
  .level-btn small{display:block; font-weight:700; color:var(--dim); font-size:11px; margin-top:3px;}
  .level-btn:hover{border-color:var(--blue); transform:translateY(-1px);}
  .level-btn.active{background:linear-gradient(135deg, var(--blue), #2A54B8); color:#fff; border-color:transparent;
    box-shadow:0 6px 18px rgba(60,111,224,.35);}
  .level-btn.active small{color:#E7EEFF;}
  .level-btn.level-done::after{
    content:'✓'; position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--red); color:#fff; font-size:11px; font-weight:800; display:flex;
    align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.2);
  }

  #startBtn{font-family:var(--font-display); font-weight:600; font-size:18px; color:#3A2400;
    background:linear-gradient(135deg, var(--yellow), #F0A93A); border:none; border-radius:999px;
    padding:14px 40px; cursor:pointer; box-shadow:0 10px 26px rgba(255,201,60,.4); transition:transform .15s ease;}
  #startBtn:hover{transform:translateY(-2px) scale(1.02);}
  #startBtn:active{transform:translateY(0) scale(.98);}

  /* ---------- GAME ---------- */
  #gameScreen{position:relative; z-index:2; flex:1; display:none; flex-direction:column; min-height:0;}
  #topbar{display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 60px 8px 14px; font-family:var(--font-body); font-weight:800; font-size:13px;
    color:var(--dim); position:relative; z-index:10;}
  #backBtn{background:rgba(255,255,255,.75); border:none; color:var(--ink); font-weight:800;
    border-radius:999px; padding:6px 14px; cursor:pointer; font-family:var(--font-body); font-size:12px;}
  .stat{background:rgba(255,255,255,.75); border-radius:999px; padding:6px 14px;}
  .stat b{color:var(--ink);}

  #gameWrap{flex:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:0 10px 10px;}
  #gameArea{
    position:relative; width:min(92vw,380px); height:min(64vh,560px);
    border-radius:20px; overflow:hidden; box-shadow:0 16px 34px rgba(27,42,74,.3);
    perspective:900px; touch-action:none; background:var(--sky-top);
  }
  .layer{ position:absolute; inset:0; }
  #layerSky{ background:linear-gradient(180deg, #5EC8F2 0%, #BDEBFF 75%, #D8F5E0 100%);
    transform:translateZ(-260px) scale(1.42); }
  #layerSky .cloud{ position:absolute; background:#fff; border-radius:50%; opacity:.9; }
  #layerHills{ transform:translateZ(-130px) scale(1.2); background-repeat:repeat-x; background-position:0 100%; }
  #layerHills .hill{ position:absolute; bottom:0; border-radius:50% 50% 0 0; background:#3FA65C; opacity:.85;}
  #playLayer{ position:absolute; inset:0; transform:translateZ(0); }
  #groundLayer{ position:absolute; left:0; right:0; bottom:0; height:15%; background:
    linear-gradient(180deg,#C9A15E,#A87B3E); border-top:6px solid #8FDB6E; z-index:5; }
  #groundLayer::before{ content:''; position:absolute; inset:0; background-image:
    repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 3px, transparent 3px 22px); }

  .bird{ position:absolute; width:50px; height:46px; z-index:8; will-change:transform,top,left;
    filter:drop-shadow(0 5px 6px rgba(0,0,0,.28)); }
  .bird .wing{ position:absolute; left:4px; top:19px; width:24px; height:17px;
    background:linear-gradient(160deg,#FFE3B8,#F0B26B); border-radius:50% 50% 45% 55%;
    transform-origin:85% 35%; transform:rotate(6deg); transition:transform .16s cubic-bezier(.4,1.6,.6,1); z-index:1;
    box-shadow:inset -2px -2px 4px rgba(0,0,0,.12);}
  .bird.flap .wing{ transform:rotate(-65deg) scale(1.08); }
  .bird .body{ position:absolute; left:4px; top:9px; width:42px; height:33px; border-radius:52% 52% 48% 48%;
    background:radial-gradient(circle at 35% 28%, #7FB4FF, var(--blue) 65%, #2A54B8 100%); z-index:2;
    box-shadow:inset -5px -5px 8px rgba(0,0,0,.15);}
  .bird .cap{ position:absolute; top:-5px; left:8px; width:32px; height:16px; background:linear-gradient(160deg,#FF6B60,var(--red));
    border-radius:20px 20px 6px 6px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15); z-index:4;}
  .bird .cap::after{ content:''; position:absolute; right:-9px; top:6px; width:15px; height:8px;
    background:var(--red); border-radius:0 8px 8px 2px;}
  .bird .eye{ position:absolute; top:13px; left:24px; width:17px; height:17px; background:#fff; border-radius:50%;
    box-shadow:0 1px 3px rgba(0,0,0,.25); z-index:4;}
  .bird .pupil{ position:absolute; top:4px; left:6px; width:8px; height:8px; background:#20242c; border-radius:50%;}
  .bird .pupil::after{ content:''; position:absolute; top:-2px; left:-2px; width:3px; height:3px; background:#fff; border-radius:50%;}
  .bird .beak{ position:absolute; top:23px; left:38px; width:0; height:0; z-index:3;
    border-top:6px solid transparent; border-bottom:6px solid transparent; border-left:11px solid #FFA23C;}

  .pipe-top, .pipe-bottom{ position:absolute; width:56px;
    background:linear-gradient(90deg, #1F8A3B 0%, #3FCB65 20%, #2FAE4E 55%, #1A7A34 100%);
    border:3px solid var(--green-dark); box-shadow:inset -8px 0 12px rgba(0,0,0,.18); z-index:6;}
  .pipe-cap{ position:absolute; left:-6px; width:68px; height:26px;
    background:linear-gradient(90deg, #1F8A3B, #3FCB65 22%, #2FAE4E 60%, #1A7A34);
    border:3px solid var(--green-dark); border-radius:6px; box-shadow:inset -8px 0 12px rgba(0,0,0,.18);}

  .coin{ position:absolute; width:26px; height:26px; border-radius:50%; z-index:7;
    background:radial-gradient(circle at 35% 30%, #FFF3B0, var(--yellow) 55%, #E0A310 100%);
    border:2px solid #C9820E; box-shadow:0 3px 6px rgba(0,0,0,.25);
    animation:coinSpin 1.1s linear infinite;}
  @keyframes coinSpin{ 0%,100%{ transform:scaleX(1);} 50%{ transform:scaleX(.15);} }

  .score-pop{ position:absolute; z-index:12; font-family:var(--font-display); font-weight:700; color:var(--yellow);
    font-size:20px; text-shadow:0 2px 4px rgba(0,0,0,.35); pointer-events:none;
    animation:scorePop .6s ease-out forwards;}
  @keyframes scorePop{ 0%{opacity:1; transform:translateY(0) scale(1);} 100%{opacity:0; transform:translateY(-34px) scale(1.3);} }

  .spark{ position:absolute; width:6px; height:6px; border-radius:50%; z-index:12; pointer-events:none;
    animation:sparkFly .5s ease-out forwards;}
  @keyframes sparkFly{ 0%{opacity:1; transform:translate(0,0) scale(1);} 100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.3);} }

  #readyHint{position:absolute; inset:0; z-index:9; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; text-align:center; padding:20px; background:rgba(27,42,74,.15);}
  #readyHint .badge{background:rgba(255,255,255,.92); border-radius:16px; padding:14px 22px;
    font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--ink);
    box-shadow:0 8px 18px rgba(0,0,0,.2); animation:pulseHint 1.4s ease-in-out infinite;}
  @keyframes pulseHint{0%,100%{transform:scale(1);} 50%{transform:scale(1.06);}}

  #gameArea.shake{ animation:shakeArea .35s ease; }
  @keyframes shakeArea{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px) rotate(-1deg); }
    40%{ transform:translateX(7px) rotate(1deg); }
    60%{ transform:translateX(-5px); }
    80%{ transform:translateX(4px); }
  }

  /* ---------- LEVEL COMPLETE / GAME OVER ---------- */
  #finishScreen, #overScreen{position:relative; z-index:2; flex:1; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; text-align:center; padding:24px;}
  .btn-row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  .secondary-btn{font-family:var(--font-body); font-weight:800; font-size:14px; color:var(--ink);
    background:rgba(255,255,255,.8); border:2px solid rgba(27,42,74,.14); border-radius:999px;
    padding:12px 26px; cursor:pointer;}
  .score-big{font-family:var(--font-display); font-size:44px; font-weight:700; color:#C23A2E;}

  @media (prefers-reduced-motion: reduce){
    .mascot{animation:none;}
    #menuScreen > *{animation:menuIn .01s linear both;}
    .coin{animation:none;}
    #gameArea.shake{animation:none;}
  }
</style>
</head>
<body>
<div id="stage">
  <button id="musicToggle" aria-label="Musik latar">🔇</button>

  <!-- MENU -->
  <div id="menuScreen">
    <div class="mascot" aria-hidden="true">🪙</div>
    <div class="title-wrap">
      <span class="kicker">Petualangan Seru</span>
      <h1>🟢 Loncat Pipa Emas</h1>
      <p class="subtitle">Tap layar untuk terbang, hindari pipa, dan kumpulkan koin emas!</p>
    </div>
    <div class="panel">
      <h2>Pilih Level</h2>
      <div class="level-grid" id="levelGrid"></div>
    </div>
    <button id="startBtn">Mulai Main 🚀</button>
  </div>

  <!-- GAME -->
  <div id="gameScreen">
    <div id="topbar">
      <button id="backBtn">← Menu</button>
      <div class="stat">Skor <b id="lblScore">0</b>/<span id="lblTarget">8</span></div>
      <div class="stat">🪙 <b id="lblCoins">0</b></div>
    </div>
    <div id="gameWrap">
      <div id="gameArea">
        <div class="layer" id="layerSky"></div>
        <div class="layer" id="layerHills"></div>
        <div id="playLayer"></div>
        <div id="groundLayer"></div>
        <div id="readyHint"><div class="badge">👆 Tap untuk terbang!</div></div>
      </div>
    </div>
  </div>

  <!-- LEVEL COMPLETE -->
  <div id="finishScreen">
    <span class="kicker" id="finishKicker">Level Selesai!</span>
    <h1 id="finishTitle" style="font-size:clamp(24px,5vw,36px)">🎉 Kamu berhasil!</h1>
    <div class="score-big" id="finalScore">0</div>
    <p class="subtitle">skor tercapai</p>
    <div class="btn-row">
      <button class="secondary-btn" id="nextLevelBtn" hidden style="background:linear-gradient(135deg,var(--yellow),#F0A93A); color:#3A2400; border:none;">Lanjut Level Berikutnya ➡️</button>
    </div>
    <div class="btn-row">
      <button class="secondary-btn" id="restartBtn">🔁 Ulangi Level Ini</button>
      <button class="secondary-btn" id="menuBtn2" style="background:linear-gradient(135deg,var(--blue),#2A54B8); color:#fff; border:none;">🏠 Menu Utama</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="overScreen">
    <span class="kicker" style="color:#C23A2E">Coba Lagi!</span>
    <h1 style="font-size:clamp(24px,5vw,36px)">💥 Kena pipa!</h1>
    <div class="score-big" id="overScore">0</div>
    <p class="subtitle" id="overTargetLabel">dari target 8</p>
    <div class="btn-row">
      <button class="secondary-btn" id="retryBtn" style="background:linear-gradient(135deg,var(--yellow),#F0A93A); color:#3A2400; border:none;">🔁 Coba Lagi</button>
      <button class="secondary-btn" id="menuBtn3">🏠 Menu Utama</button>
    </div>
  </div>
</div>

<script>

function submitPortalScore(gameKey, score) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'MAINEDU_SUBMIT_SCORE',
        gameKey: gameKey,
        score: Number(score) || 0
      }, '*');
    }
  } catch(e) {}
}

const CURRENT_GAME_KEY = "jump";
(function(){
  const LEVELS = {
    mudah:  { label:'Mudah',  sub:'target 6',  gravity:.22, flap:-5.2, speed:1.5, gap:215, spacing:290, target:6 },
    sedang: { label:'Sedang', sub:'target 10', gravity:.28, flap:-5.6, speed:1.9, gap:180, spacing:255, target:10 },
    sulit:  { label:'Sulit',  sub:'target 14', gravity:.34, flap:-6.0, speed:2.3, gap:155, spacing:225, target:14 },
  };
  const LEVEL_ORDER = ['mudah', 'sedang', 'sulit'];

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const finishScreen = document.getElementById('finishScreen');
  const overScreen = document.getElementById('overScreen');
  const levelGrid = document.getElementById('levelGrid');
  const gameArea = document.getElementById('gameArea');
  const playLayer = document.getElementById('playLayer');
  const layerHills = document.getElementById('layerHills');
  const layerSky = document.getElementById('layerSky');
  const readyHint = document.getElementById('readyHint');

  let state = {
    levelKey: 'mudah',
    doneLevels: new Set(),
    running: false,
    ready: true,
    player: { x:70, y:200, vy:0, size:42 },
    pipes: [],
    score: 0,
    coins: 0,
    areaW: 340, areaH: 460, groundH: 60,
    bgOffsets: { sky:0, hills:0, ground:0 },
    rafId: null,
  };

  // ---------- sound effects ----------
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTone({freq=440, freqEnd=null, duration=0.12, type='sine', volume=0.15, delay=0}){
    const ctx = ensureAudio();
    if(!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(freqEnd !== null){ osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0+duration); }
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(volume, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+duration+0.03);
  }
  function sfxFlap(){ playTone({freq:420, freqEnd:620, duration:0.09, type:'triangle', volume:0.11}); }
  function sfxScore(){ playTone({freq:880, duration:0.1, type:'square', volume:0.12}); }
  function sfxCoin(){ playTone({freq:1046, duration:0.08, type:'triangle', volume:0.15}); playTone({freq:1318, duration:0.1, type:'triangle', volume:0.13, delay:0.06}); }
  function sfxCrash(){ playTone({freq:180, freqEnd:60, duration:0.35, type:'sawtooth', volume:0.2}); }
  function sfxLevelUp(){ [523,659,784,1046].forEach((f,i)=>playTone({freq:f, duration:0.16, type:'triangle', volume:0.17, delay:i*0.09})); }
  function sfxClick(){ playTone({freq:600, duration:0.05, type:'square', volume:0.06}); }

  // ---------- background music (chiptune-ish loop) ----------
  let musicOn = false;
  let musicTimer = null;
  let musicGain = null;
  let musicStep = 0;
  const MUSIC_PATTERN = [523.25, 523.25, null, 523.25, null, 415.30, 523.25, null, 587.33, null, null, null];
  const musicToggleBtn = document.getElementById('musicToggle');

  function ensureMusicGain(){
    const ctx = ensureAudio();
    if(!ctx) return null;
    if(!musicGain){
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.0001;
      musicGain.connect(ctx.destination);
    }
    return musicGain;
  }
  function playMusicNote(freq){
    const ctx = ensureAudio();
    const gainBus = ensureMusicGain();
    if(!ctx || !gainBus) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.035, t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.22);
    osc.connect(g).connect(gainBus);
    osc.start(t0);
    osc.stop(t0+0.25);
  }
  function startMusic(){
    const ctx = ensureAudio();
    const gainBus = ensureMusicGain();
    if(!ctx || !gainBus || musicTimer) return;
    gainBus.gain.cancelScheduledValues(ctx.currentTime);
    gainBus.gain.linearRampToValueAtTime(1, ctx.currentTime+0.5);
    musicStep = 0;
    musicTimer = setInterval(()=>{
      const note = MUSIC_PATTERN[musicStep % MUSIC_PATTERN.length];
      if(note) playMusicNote(note);
      musicStep++;
    }, 190);
  }
  function stopMusic(){
    if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
    if(musicGain){
      const ctx = ensureAudio();
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+0.3);
    }
  }
  function updateMusicBtn(){
    musicToggleBtn.textContent = musicOn ? '🔊' : '🔇';
    musicToggleBtn.classList.toggle('on', musicOn);
  }
  musicToggleBtn.onclick = () => {
    musicOn = !musicOn;
    if(musicOn){ ensureAudio(); startMusic(); } else { stopMusic(); }
    updateMusicBtn();
  };

  // ---------- menu ----------
  function buildLevelGrid(){
    levelGrid.innerHTML = '';
    Object.entries(LEVELS).forEach(([key, cfg]) => {
      const btn = document.createElement('button');
      btn.className = 'level-btn' + (key===state.levelKey ? ' active':'') + (state.doneLevels.has(key) ? ' level-done':'');
      btn.innerHTML = cfg.label + '<small>' + cfg.sub + '</small>';
      btn.onclick = () => {
        sfxClick();
        state.levelKey = key;
        [...levelGrid.children].forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      };
      levelGrid.appendChild(btn);
    });
  }
  buildLevelGrid();

  // decorative clouds / hills (built once, reused across layers via CSS background scroll)
  function buildDecor(){
    layerSky.querySelectorAll('.cloud').forEach(el=>el.remove());
    for(let i=0;i<5;i++){
      const c = document.createElement('div');
      c.className = 'cloud';
      const w = 40+Math.random()*40, h = w*0.5;
      c.style.width = w+'px'; c.style.height = h+'px';
      c.style.left = (i*22 + Math.random()*10)+'%';
      c.style.top = (8+Math.random()*30)+'%';
      layerSky.appendChild(c);
    }
    layerHills.querySelectorAll('.hill').forEach(el=>el.remove());
    for(let i=0;i<6;i++){
      const h = document.createElement('div');
      h.className = 'hill';
      const w = 90+Math.random()*60;
      h.style.width = w+'px'; h.style.height = (w*0.6)+'px';
      h.style.left = (i*70 - 40)+'px';
      layerHills.appendChild(h);
    }
  }
  buildDecor();

  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  // ---------- game setup ----------
  function measureArea(){
    const rect = gameArea.getBoundingClientRect();
    state.areaW = rect.width;
    state.areaH = rect.height;
    state.groundH = rect.height * 0.15;
  }

  function resetAttempt(){
    measureArea();
    state.player.x = state.areaW * 0.22;
    state.player.y = state.areaH * 0.42;
    state.player.vy = 0;
    state.pipes = [];
    state.score = 0;
    state.coins = 0;
    state.ready = true;
    state.running = false;
    playLayer.innerHTML = '';
    const bird = document.createElement('div');
    bird.className = 'bird';
    bird.id = 'bird';
    bird.innerHTML = '<div class="wing"></div><div class="body"></div><div class="cap"></div><div class="eye"><div class="pupil"></div></div><div class="beak"></div>';
    playLayer.appendChild(bird);
    positionBird();
    readyHint.hidden = false;
    updateHud();
    gameArea.classList.remove('shake');

    const cfg = LEVELS[state.levelKey];
    document.getElementById('lblTarget').textContent = cfg.target;
  }

  function positionBird(){
    const bird = document.getElementById('bird');
    if(!bird) return;
    bird.style.left = state.player.x + 'px';
    bird.style.top = state.player.y + 'px';
    const angle = Math.max(-25, Math.min(70, state.player.vy * 4));
    bird.style.transform = 'rotate(' + angle + 'deg)';
  }

  function updateHud(){
    document.getElementById('lblScore').textContent = state.score;
    document.getElementById('lblCoins').textContent = state.coins;
  }

  function spawnPipe(){
    const cfg = LEVELS[state.levelKey];
    const margin = 36;
    const gapTop = randInt(margin, state.areaH - state.groundH - margin - cfg.gap);
    const pipe = {
      x: state.areaW + 10,
      gapTop, gapHeight: cfg.gap, width: 56,
      passed: false, hasCoin: Math.random() < 0.55, coinCollected: false,
      topEl: null, botEl: null, coinEl: null,
    };
    const topEl = document.createElement('div');
    topEl.className = 'pipe-top';
    topEl.innerHTML = '<div class="pipe-cap"></div>';
    topEl.style.top = '0px';
    const botEl = document.createElement('div');
    botEl.className = 'pipe-bottom';
    botEl.innerHTML = '<div class="pipe-cap" style="bottom:-6px; top:auto;"></div>';
    playLayer.appendChild(topEl);
    playLayer.appendChild(botEl);
    pipe.topEl = topEl; pipe.botEl = botEl;

    if(pipe.hasCoin){
      const coinEl = document.createElement('div');
      coinEl.className = 'coin';
      playLayer.appendChild(coinEl);
      pipe.coinEl = coinEl;
    }
    state.pipes.push(pipe);
  }

  function layoutPipe(pipe){
    pipe.topEl.style.left = pipe.x + 'px';
    pipe.topEl.style.height = pipe.gapTop + 'px';
    pipe.topEl.querySelector('.pipe-cap').style.top = (pipe.gapTop - 26) + 'px';

    const botTop = pipe.gapTop + pipe.gapHeight;
    const botHeight = state.areaH - state.groundH - botTop;
    pipe.botEl.style.left = pipe.x + 'px';
    pipe.botEl.style.top = botTop + 'px';
    pipe.botEl.style.height = Math.max(botHeight,0) + 'px';

    if(pipe.coinEl && !pipe.coinCollected){
      pipe.coinEl.style.left = (pipe.x + pipe.width/2 - 13) + 'px';
      pipe.coinEl.style.top = (pipe.gapTop + pipe.gapHeight/2 - 13) + 'px';
    }
  }

  function removePipe(pipe){
    pipe.topEl.remove(); pipe.botEl.remove();
    if(pipe.coinEl) pipe.coinEl.remove();
  }

  function spawnScorePop(x, y, text, color){
    const el = document.createElement('div');
    el.className = 'score-pop';
    el.textContent = text;
    el.style.left = x+'px'; el.style.top = y+'px';
    el.style.color = color || 'var(--yellow)';
    playLayer.appendChild(el);
    setTimeout(()=>el.remove(), 620);
  }
  function spawnSparks(x, y, color){
    for(let i=0;i<8;i++){
      const s = document.createElement('div');
      s.className = 'spark';
      const ang = (Math.PI*2*i)/8;
      s.style.setProperty('--dx', Math.cos(ang)*26+'px');
      s.style.setProperty('--dy', Math.sin(ang)*26+'px');
      s.style.left = x+'px'; s.style.top = y+'px';
      s.style.background = color;
      playLayer.appendChild(s);
      setTimeout(()=>s.remove(), 520);
    }
  }

  function flap(){
    if(!state.running && !state.ready) return;
    if(state.ready){
      state.ready = false;
      readyHint.hidden = true;
      state.running = true;
      loop();
    }
    const cfg = LEVELS[state.levelKey];
    state.player.vy = cfg.flap;
    sfxFlap();
    const bird = document.getElementById('bird');
    if(bird){
      bird.classList.remove('flap');
      void bird.offsetWidth;
      bird.classList.add('flap');
      setTimeout(()=>bird.classList.remove('flap'), 160);
    }
  }

  gameArea.addEventListener('pointerdown', (e) => { e.preventDefault(); flap(); });
  window.addEventListener('keydown', (e) => {
    if(e.code === 'Space' && gameScreen.style.display === 'flex'){ e.preventDefault(); flap(); }
  });

  function checkCollision(){
    const p = state.player;
    const inset = p.size * 0.16;
    const hx = p.x + inset, hy = p.y + inset, hs = p.size - inset*2;
    if(hy + hs >= state.areaH - state.groundH){ return true; }
    if(p.y <= 0){ p.y = 0; p.vy = 0; }
    for(const pipe of state.pipes){
      const overlapX = hx + hs > pipe.x && hx < pipe.x + pipe.width;
      if(overlapX){
        if(hy < pipe.gapTop || hy + hs > pipe.gapTop + pipe.gapHeight){
          return true;
        }
      }
    }
    return false;
  }

  function loop(){
    if(!state.running) return;
    const cfg = LEVELS[state.levelKey];
    const p = state.player;
    p.vy += cfg.gravity;
    p.y += p.vy;
    positionBird();

    // parallax scroll
    state.bgOffsets.hills -= cfg.speed * 0.35;
    state.bgOffsets.sky -= cfg.speed * 0.08;
    layerHills.style.backgroundPosition = state.bgOffsets.hills + 'px 100%';
    layerHills.querySelectorAll('.hill').forEach((h,i) => {
      const baseLeft = i*70 - 40;
      let left = ((baseLeft + state.bgOffsets.hills) % 480 + 480) % 480 - 60;
      h.style.left = left + 'px';
    });

    // move & manage pipes
    for(let i=state.pipes.length-1; i>=0; i--){
      const pipe = state.pipes[i];
      pipe.x -= cfg.speed;
      layoutPipe(pipe);

      if(!pipe.passed && pipe.x + pipe.width < p.x){
        pipe.passed = true;
        state.score++;
        updateHud();
        sfxScore();
        spawnScorePop(p.x, p.y - 10, '+1', 'var(--yellow)');
      }

      if(pipe.hasCoin && !pipe.coinCollected){
        const cx = pipe.x + pipe.width/2, cy = pipe.gapTop + pipe.gapHeight/2;
        const dx = (p.x+p.size/2) - cx, dy = (p.y+p.size/2) - cy;
        if(Math.sqrt(dx*dx+dy*dy) < 24){
          pipe.coinCollected = true;
          if(pipe.coinEl){ pipe.coinEl.remove(); pipe.coinEl = null; }
          state.coins++;
          state.score++;
          updateHud();
          sfxCoin();
          spawnSparks(cx, cy, '#FFD24C');
          spawnScorePop(cx, cy-16, '+1 🪙', '#FFD24C');
        }
      }

      if(pipe.x + pipe.width < -10){
        removePipe(pipe);
        state.pipes.splice(i,1);
      }
    }

    if(state.pipes.length === 0 || state.pipes[state.pipes.length-1].x < state.areaW - cfg.spacing){
      spawnPipe();
    }

    if(checkCollision()){
      onCrash();
      return;
    }

    if(state.score >= cfg.target){
      onLevelComplete();
      return;
    }

    state.rafId = requestAnimationFrame(loop);
  }

  function onCrash(){
    state.running = false;
    cancelAnimationFrame(state.rafId);
    sfxCrash();
    gameArea.classList.add('shake');
    spawnSparks(state.player.x+state.player.size/2, state.player.y+state.player.size/2, '#E8433A');
    setTimeout(() => {
      gameScreen.style.display = 'none';
      overScreen.style.display = 'flex';
      document.getElementById('overScore').textContent = state.score;
      document.getElementById('overTargetLabel').textContent = 'dari target ' + LEVELS[state.levelKey].target;
    }, 500);
  }

  function onLevelComplete(){
    state.running = false;
    cancelAnimationFrame(state.rafId);
    sfxLevelUp();
    gameScreen.style.display = 'none';
    finishScreen.style.display = 'flex';
    document.getElementById('finalScore').textContent = state.score;

    state.doneLevels.add(state.levelKey);
    const curIdx = LEVEL_ORDER.indexOf(state.levelKey);
    const nextKey = LEVEL_ORDER[curIdx+1];
    const nextBtn = document.getElementById('nextLevelBtn');
    const kicker = document.getElementById('finishKicker');
    const title = document.getElementById('finishTitle');

    if(nextKey){
      kicker.textContent = 'Level ' + LEVELS[state.levelKey].label + ' Selesai!';
      title.textContent = '🎉 Kamu berhasil!';
      nextBtn.hidden = false;
      nextBtn.textContent = 'Lanjut ke Level ' + LEVELS[nextKey].label + ' ➡️';
      nextBtn.onclick = () => { sfxClick(); state.levelKey = nextKey; startGame(); };
    } else {
      kicker.textContent = 'Semua Level Selesai!';
      title.textContent = '🏆 Kamu Juara Loncat Pipa!';
      nextBtn.hidden = true;
    }
  }

  function startGame(){
    ensureAudio();
    menuScreen.style.display = 'none';
    finishScreen.style.display = 'none';
    overScreen.style.display = 'none';
    gameScreen.style.display = 'flex';
    requestAnimationFrame(resetAttempt);
  }
  function backToMenu(){
    state.running = false;
    if(state.rafId) cancelAnimationFrame(state.rafId);
    gameScreen.style.display = 'none';
    finishScreen.style.display = 'none';
    overScreen.style.display = 'none';
    menuScreen.style.display = 'flex';
    buildLevelGrid();
  }

  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('backBtn').onclick = (e) => { e.stopPropagation(); sfxClick(); backToMenu(); };
  document.getElementById('restartBtn').onclick = () => { sfxClick(); startGame(); };
  document.getElementById('menuBtn2').onclick = () => { sfxClick(); backToMenu(); };
  document.getElementById('retryBtn').onclick = () => { sfxClick(); startGame(); };
  document.getElementById('menuBtn3').onclick = () => { sfxClick(); backToMenu(); };

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if(gameScreen.style.display==='flex') measureArea(); }, 250);
  });
})();
</script>
</body>
</html>
