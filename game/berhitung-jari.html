<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Berhitung Jari — main-edu</title>
<meta name="theme-color" content="#E3F6FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#E3F6FF;
    --bg-bottom:#FFF3D9;
    --ink:#1F3A5F;
    --dim:#5E7791;
    --panel-bg:rgba(255,255,255,.62);
    --red:#FF5A5F;
    --blue:#4C8DFF;
    --yellow:#FFC93C;
    --green:#3FCB7E;
    --purple:#A66DFF;
    --skin:#FFCFA0;
    --skin-dark:#F0AE71;
    --font-display:'Fredoka', sans-serif;
    --font-body:'Nunito', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden;
    background:linear-gradient(165deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    font-family:var(--font-body); color:var(--ink);}
  #stage{position:relative; width:100%; height:100vh; min-height:580px; display:flex; flex-direction:column; overflow:hidden;}
  [hidden]{display:none !important;}

  #musicToggle{
    position:absolute; top:14px; right:14px; z-index:30;
    width:40px; height:40px; border-radius:50%;
    background:rgba(31,58,95,.08); border:1px solid rgba(31,58,95,.14);
    color:var(--ink); font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, background .15s ease;
  }
  #musicToggle:hover{ background:rgba(31,58,95,.16); }
  #musicToggle:active{ transform:scale(.9); }
  #musicToggle.on{ background:linear-gradient(135deg, var(--blue), #2E6FE0); color:#fff; border-color:transparent; }

  /* ---------- MENU ---------- */
  #menuScreen{position:relative; z-index:2; flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px; gap:18px;}
  #menuScreen > *{ animation:menuIn .6s cubic-bezier(.22,.9,.32,1.1) both; }
  #menuScreen > *:nth-child(1){ animation-delay:.05s; }
  #menuScreen > *:nth-child(2){ animation-delay:.16s; }
  #menuScreen > *:nth-child(3){ animation-delay:.27s; }
  #menuScreen > *:nth-child(4){ animation-delay:.38s; }
  @keyframes menuIn{0%{opacity:0; transform:translateY(20px) scale(.97);} 100%{opacity:1; transform:translateY(0) scale(1);}}

  .mascot{position:absolute; top:6%; left:8%; font-size:38px; pointer-events:none;
    animation:bob 4.2s ease-in-out infinite, menuIn .6s ease .5s both;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg);} 50%{transform:translateY(-12px) rotate(6deg);}}

  .kicker{font-family:var(--font-body); font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    font-size:12px; color:#2E6FE0;}
  h1{font-family:var(--font-display); font-weight:700; font-size:clamp(28px,6vw,44px); margin:6px 0 0; color:var(--ink);}
  .subtitle{color:var(--dim); font-size:15px; max-width:400px; margin:6px auto 0; font-weight:700;}

  .panel{background:var(--panel-bg); border:1px solid rgba(31,58,95,.08); border-radius:20px;
    padding:18px 20px; width:min(92vw,420px); backdrop-filter:blur(6px);
    box-shadow:0 10px 26px rgba(31,58,95,.08);}
  .panel h2{font-family:var(--font-display); font-size:13px; font-weight:600; margin:0 0 12px;
    color:var(--dim); text-transform:uppercase; letter-spacing:.08em; text-align:left;}
  .level-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .level-btn{position:relative; font-family:var(--font-body); font-weight:800; font-size:14px; color:var(--ink);
    background:rgba(255,255,255,.7); border:2px solid rgba(31,58,95,.1); border-radius:14px;
    padding:12px 6px; cursor:pointer; transition:all .15s ease;}
  .level-btn small{display:block; font-weight:700; color:var(--dim); font-size:11px; margin-top:3px;}
  .level-btn:hover{border-color:var(--blue); transform:translateY(-1px);}
  .level-btn.active{background:linear-gradient(135deg, var(--blue), #2E6FE0); color:#fff; border-color:transparent;
    box-shadow:0 6px 18px rgba(76,141,255,.35);}
  .level-btn.active small{color:#EAF1FF;}
  .level-btn.level-done::after{
    content:'✓'; position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
    background:var(--red); color:#fff; font-size:11px; font-weight:800; display:flex;
    align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.2);
  }

  #startBtn{font-family:var(--font-display); font-weight:600; font-size:18px; color:#3A2400;
    background:linear-gradient(135deg, var(--yellow), #F0A93A); border:none; border-radius:999px;
    padding:14px 40px; cursor:pointer; box-shadow:0 10px 26px rgba(255,201,60,.4); transition:transform .15s ease;}
  #startBtn:hover{transform:translateY(-2px) scale(1.02);}
  #startBtn:active{transform:translateY(0) scale(.98);}

  /* ---------- GAME ---------- */
  #gameScreen{position:relative; z-index:2; flex:1; display:none; flex-direction:column; min-height:0;}
  #topbar{display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:12px 60px 6px 16px; font-family:var(--font-body); font-weight:800; font-size:13px;
    color:var(--dim); flex-wrap:wrap;}
  #backBtn{background:rgba(31,58,95,.08); border:none; color:var(--ink); font-weight:800;
    border-radius:999px; padding:6px 14px; cursor:pointer; font-family:var(--font-body); font-size:12px;}
  .stat{background:rgba(255,255,255,.65); border-radius:999px; padding:6px 14px;}
  .stat b{color:var(--ink);}

  #problemArea{display:flex; align-items:flex-end; justify-content:center; gap:clamp(6px,2.5vw,14px);
    padding:10px 6px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  #problemArea::-webkit-scrollbar{ display:none; }
  .operand{display:flex; flex-direction:column; align-items:center; gap:6px; flex:0 0 auto;}
  .operand .numeral{font-family:var(--font-display); font-weight:700; font-size:clamp(26px,6.5vw,38px); color:var(--ink);}
  .hands-row{display:flex; gap:4px; height:clamp(76px,22vw,128px);}

  .hand{position:relative; width:clamp(60px,17vw,100px); height:clamp(76px,22vw,127px); flex:0 0 auto;
    animation:handPop .4s cubic-bezier(.3,1.2,.4,1.3) both; filter:drop-shadow(0 6px 8px rgba(31,58,95,.18));}
  .hand:nth-child(2){ animation-delay:.12s; }
  .hand.mirror{ transform:scaleX(-1); }
  @keyframes handPop{0%{opacity:0; transform:scale(.6) translateY(10px);} 100%{opacity:1; transform:scale(1) translateY(0);}}
  .hand.mirror{ animation-name:handPopMirror; }
  @keyframes handPopMirror{0%{opacity:0; transform:scaleX(-1) scale(.6) translateY(10px);} 100%{opacity:1; transform:scaleX(-1) scale(1) translateY(0);}}

  .op-symbol{font-family:var(--font-display); font-weight:700; font-size:clamp(26px,7vw,46px); color:var(--red); align-self:center; margin-bottom:clamp(14px,6vw,26px); flex:0 0 auto;}
  .eq-box{display:flex; flex-direction:column; align-items:center; gap:4px; align-self:center; margin-bottom:clamp(14px,6vw,26px); flex:0 0 auto;}
  .eq-symbol{font-family:var(--font-display); font-weight:700; font-size:clamp(26px,7vw,46px); color:var(--ink);}
  .answer-slot{width:64px; height:64px; border-radius:16px; background:rgba(255,255,255,.7);
    border:3px dashed rgba(31,58,95,.3); display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:30px; color:var(--dim); transition:all .2s ease;}
  .answer-slot.revealed{ border-style:solid; border-color:var(--green); color:var(--ink); background:#DFF7E8; }

  #choicesGrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:16px 20px 20px;
    width:min(92vw,440px); margin:0 auto;}
  .choice-btn{
    border:none; border-radius:18px; cursor:pointer; font-family:var(--font-display); font-weight:700;
    font-size:clamp(22px,6vw,30px); color:#fff; box-shadow:0 8px 16px rgba(31,58,95,.18);
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; transition:transform .15s ease;
  }
  .choice-btn:active{ transform:scale(.93); }
  .choice-btn.correct{ box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--green); animation:correctPulse .5s ease; }
  .choice-btn.wrong{ animation:shakeChoice .4s ease; filter:grayscale(.4); }
  @keyframes correctPulse{0%{transform:scale(1);} 40%{transform:scale(1.12);} 100%{transform:scale(1);}}
  @keyframes shakeChoice{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}

  .praise-float{
    position:absolute; left:50%; top:38%; transform:translate(-50%,0); pointer-events:none;
    font-family:var(--font-display); font-weight:700; font-size:28px; color:var(--green);
    text-shadow:0 2px 8px rgba(0,0,0,.15); opacity:0; z-index:20;
  }
  .praise-float.show{ animation:praiseFloat .9s ease forwards; }
  @keyframes praiseFloat{
    0%{opacity:0; transform:translate(-50%,10px) scale(.6);}
    25%{opacity:1; transform:translate(-50%,-6px) scale(1.15);}
    100%{opacity:0; transform:translate(-50%,-46px) scale(1);}
  }

  /* ---------- FINISH ---------- */
  #finishScreen{position:relative; z-index:2; flex:1; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; text-align:center; padding:24px;}
  .btn-row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  .secondary-btn{font-family:var(--font-body); font-weight:800; font-size:14px; color:var(--ink);
    background:rgba(255,255,255,.7); border:2px solid rgba(31,58,95,.12); border-radius:999px;
    padding:12px 26px; cursor:pointer;}
  .score-big{font-family:var(--font-display); font-size:44px; font-weight:700; color:#2E6FE0;}

  @media (prefers-reduced-motion: reduce){
    .mascot{animation:none;}
    #menuScreen > *{animation:menuIn .01s linear both;}
    .hand{animation:none; filter:none;}
  }
</style>
</head>
<body>
<div id="stage">
  <button id="musicToggle" aria-label="Musik latar">🔇</button>

  <!-- MENU -->
  <div id="menuScreen">
    <div class="mascot" aria-hidden="true">🖐️</div>
    <div class="title-wrap">
      <span class="kicker">Latihan Berhitung</span>
      <h1>🖐️ Berhitung Jari</h1>
      <p class="subtitle">Hitung jari-jarinya, lalu tap angka jawaban yang tepat!</p>
    </div>
    <div class="panel">
      <h2>Pilih Level</h2>
      <div class="level-grid" id="levelGrid"></div>
    </div>
    <button id="startBtn">Mulai Berhitung ➕</button>
  </div>

  <!-- GAME -->
  <div id="gameScreen">
    <div id="topbar">
      <button id="backBtn">← Menu</button>
      <div class="stat">Percobaan <b id="lblMoves">0</b></div>
      <div class="stat">Benar <b id="lblCorrect">0</b>/<span id="lblTotal">0</span></div>
    </div>
    <div id="problemArea"></div>
    <div id="choicesGrid"></div>
  </div>

  <!-- FINISH -->
  <div id="finishScreen">
    <span class="kicker" id="finishKicker">Selesai!</span>
    <h1 id="finishTitle" style="font-size:clamp(24px,5vw,36px)">🎉 Semua soal selesai!</h1>
    <div class="score-big" id="finalMoves">0</div>
    <p class="subtitle">kali percobaan</p>
    <div class="btn-row">
      <button class="secondary-btn" id="nextLevelBtn" hidden style="background:linear-gradient(135deg,var(--yellow),#F0A93A); color:#3A2400; border:none;">Lanjut Level Berikutnya ➡️</button>
    </div>
    <div class="btn-row">
      <button class="secondary-btn" id="restartBtn">🔁 Ulangi Level Ini</button>
      <button class="secondary-btn" id="menuBtn2" style="background:linear-gradient(135deg,var(--blue),#2E6FE0); color:#fff; border:none;">🏠 Menu Utama</button>
    </div>
  </div>
</div>

<script>
(function(){
  const LEVELS = {
    beginner: { label:'Pemula',  sub:'2 pilihan', choices:2, rounds:5, mode:'add-easy' },
    medium:   { label:'Medium',  sub:'3 pilihan', choices:3, rounds:6, mode:'mixed' },
    expert:   { label:'Expert',  sub:'4 pilihan', choices:4, rounds:8, mode:'mixed' },
  };
  const LEVEL_ORDER = ['beginner', 'medium', 'expert'];
  const CHOICE_COLORS = ['var(--red)', 'var(--blue)', 'var(--green)', 'var(--purple)'];
  const CHOICE_COLORS_DARK = ['#D8393D', '#2E6FE0', '#22A85C', '#8347E0'];
  const PRAISE = ['Hebat!', 'Pintar!', 'Betul!', 'Keren!', 'Jago!'];

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const finishScreen = document.getElementById('finishScreen');
  const levelGrid = document.getElementById('levelGrid');
  const problemArea = document.getElementById('problemArea');
  const choicesGrid = document.getElementById('choicesGrid');

  let state = {
    levelKey: 'beginner',
    roundIdx: 0,
    totalRounds: 5,
    correctCount: 0,
    moves: 0,
    doneLevels: new Set(),
    problem: null,
    locked: false,
  };

  // ---------- sound effects ----------
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTone({freq=440, freqEnd=null, duration=0.12, type='sine', volume=0.15, delay=0}){
    const ctx = ensureAudio();
    if(!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(freqEnd !== null){ osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), t0+duration); }
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(volume, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+duration+0.03);
  }
  function sfxCorrect(){ [660,880,1108].forEach((f,i)=>playTone({freq:f, duration:0.14, type:'triangle', volume:0.16, delay:i*0.08})); }
  function sfxWrong(){ playTone({freq:300, duration:0.12, type:'sine', volume:0.1}); playTone({freq:220, duration:0.18, type:'sine', volume:0.1, delay:0.1}); }
  function sfxFinish(){ [523,659,784,1046].forEach((f,i)=>playTone({freq:f, duration:0.16, type:'triangle', volume:0.16, delay:i*0.09})); }
  function sfxClick(){ playTone({freq:600, duration:0.05, type:'square', volume:0.06}); }
  function sfxFingerTick(){ playTone({freq:700, duration:0.05, type:'sine', volume:0.06}); }

  // ---------- background music ----------
  let musicOn = false;
  let musicTimer = null;
  let musicGain = null;
  let musicStep = 0;
  const MUSIC_PATTERN = [440.00, null, 523.25, 587.33, null, 659.25, 587.33, null, 523.25, null, 440.00, null];
  const musicToggleBtn = document.getElementById('musicToggle');

  function ensureMusicGain(){
    const ctx = ensureAudio();
    if(!ctx) return null;
    if(!musicGain){
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.0001;
      musicGain.connect(ctx.destination);
    }
    return musicGain;
  }
  function playMusicNote(freq){
    const ctx = ensureAudio();
    const gainBus = ensureMusicGain();
    if(!ctx || !gainBus) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.045, t0+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);
    osc.connect(g).connect(gainBus);
    osc.start(t0);
    osc.stop(t0+0.55);
  }
  function startMusic(){
    const ctx = ensureAudio();
    const gainBus = ensureMusicGain();
    if(!ctx || !gainBus || musicTimer) return;
    gainBus.gain.cancelScheduledValues(ctx.currentTime);
    gainBus.gain.linearRampToValueAtTime(1, ctx.currentTime+0.6);
    musicStep = 0;
    musicTimer = setInterval(()=>{
      const note = MUSIC_PATTERN[musicStep % MUSIC_PATTERN.length];
      if(note) playMusicNote(note);
      musicStep++;
    }, 460);
  }
  function stopMusic(){
    if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
    if(musicGain){
      const ctx = ensureAudio();
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+0.3);
    }
  }
  function updateMusicBtn(){
    musicToggleBtn.textContent = musicOn ? '🔊' : '🔇';
    musicToggleBtn.classList.toggle('on', musicOn);
  }
  musicToggleBtn.onclick = () => {
    musicOn = !musicOn;
    if(musicOn){ ensureAudio(); startMusic(); } else { stopMusic(); }
    updateMusicBtn();
  };

  // ---------- menu ----------
  function buildLevelGrid(){
    levelGrid.innerHTML = '';
    Object.entries(LEVELS).forEach(([key, cfg]) => {
      const btn = document.createElement('button');
      btn.className = 'level-btn' + (key===state.levelKey ? ' active':'') + (state.doneLevels.has(key) ? ' level-done':'');
      btn.innerHTML = cfg.label + '<small>' + cfg.sub + '</small>';
      btn.onclick = () => {
        sfxClick();
        state.levelKey = key;
        [...levelGrid.children].forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      };
      levelGrid.appendChild(btn);
    });
  }
  buildLevelGrid();

  function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function generateProblem(mode){
    let a, b, op;
    if(mode === 'add-easy'){
      op = '+';
      a = randInt(0,5);
      b = randInt(0, 5-a);
    } else {
      op = Math.random() < 0.5 ? '+' : '-';
      if(op === '+'){
        a = randInt(0,10);
        b = randInt(0, 10-a);
      } else {
        a = randInt(0,10);
        b = randInt(0, a);
      }
    }
    const result = op === '+' ? a+b : a-b;
    return { a, b, op, result };
  }

  // ---------- hand visuals (cartoon SVG hand, natural counting order) ----------
  let handUid = 0;
  function handSVG(count){
    // natural counting order: index, middle, ring, pinky, then thumb last
    const active = {
      index: count >= 1,
      middle: count >= 2,
      ring: count >= 3,
      pinky: count >= 4,
      thumb: count >= 5,
    };
    const uid = ++handUid;
    const OUT = '#D08A55';
    const SW = 3;

    // fingers: chubby capsules; extended rise above palm, curled show as knuckle bumps
    function finger(cx, len, isUp){
      if(isUp){
        const top = 64 - len;
        return `<rect x="${cx-7.5}" y="${top}" width="15" height="${len+16}" rx="7.5"/>`;
      }
      return `<rect x="${cx-7.5}" y="50" width="15" height="30" rx="7.5"/>`;
    }
    const fingers =
      finger(38, 46, active.index) +
      finger(55, 54, active.middle) +
      finger(72, 48, active.ring) +
      finger(89, 36, active.pinky);

    const thumbUp = `<rect x="-7.5" y="-46" width="15" height="52" rx="7.5" transform="translate(32,96) rotate(-32)"/>`;
    const thumbWrapped = `<rect x="30" y="86" width="36" height="17" rx="8.5"
        fill="url(#skin${uid})" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round"/>`;

    return `
    <svg viewBox="0 0 120 152" width="100%" height="100%">
      <defs>
        <linearGradient id="skin${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFE3C2"/>
          <stop offset="1" stop-color="#F5B98A"/>
        </linearGradient>
      </defs>
      <!-- behind-palm parts: wrist, fingers, extended thumb -->
      <g fill="url(#skin${uid})" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round">
        <rect x="42" y="112" width="40" height="38" rx="12"/>
        ${active.thumb ? thumbUp : ''}
        ${fingers}
      </g>
      <!-- palm on top so fingers emerge cleanly from behind its edge -->
      <g fill="url(#skin${uid})" stroke="${OUT}" stroke-width="${SW}" stroke-linejoin="round">
        <rect x="26" y="64" width="72" height="54" rx="20"/>
      </g>
      <!-- soft highlight on palm -->
      <ellipse cx="62" cy="86" rx="24" ry="14" fill="#FFFFFF" opacity="0.22"/>
      <!-- wrapped thumb across the fist when not counting 5 -->
      ${active.thumb ? '' : thumbWrapped}
    </svg>`;
  }

  function buildHandGroup(container, count){
    container.innerHTML = '';
    const groups = count <= 5 ? [count] : [5, count-5];
    groups.forEach((g, i) => {
      const hand = document.createElement('div');
      hand.className = 'hand' + (i === 1 ? ' mirror' : '');
      hand.innerHTML = handSVG(g);
      container.appendChild(hand);
    });
  }

  function updateStats(){
    document.getElementById('lblMoves').textContent = state.moves;
    document.getElementById('lblCorrect').textContent = state.correctCount;
    document.getElementById('lblTotal').textContent = state.totalRounds;
  }

  function buildRound(){
    const cfg = LEVELS[state.levelKey];
    state.problem = generateProblem(cfg.mode);
    state.locked = false;
    const { a, b, op, result } = state.problem;

    problemArea.innerHTML = `
      <div class="operand">
        <div class="hands-row" id="handsA"></div>
        <div class="numeral">${a}</div>
      </div>
      <div class="op-symbol">${op === '+' ? '+' : '−'}</div>
      <div class="operand">
        <div class="hands-row" id="handsB"></div>
        <div class="numeral">${b}</div>
      </div>
      <div class="eq-box">
        <div class="eq-symbol">=</div>
        <div class="answer-slot" id="answerSlot">?</div>
      </div>
    `;
    buildHandGroup(document.getElementById('handsA'), a);
    buildHandGroup(document.getElementById('handsB'), b);
    sfxFingerTick();

    // build choices
    const distractorPool = new Set();
    let tries = 0;
    while(distractorPool.size < cfg.choices-1 && tries < 50){
      tries++;
      const delta = randInt(-3,3);
      const candidate = result + delta;
      if(candidate === result || candidate < 0 || candidate > 10) continue;
      distractorPool.add(candidate);
    }
    // fallback fill if not enough distractors found
    let fallback = 0;
    while(distractorPool.size < cfg.choices-1 && fallback <= 10){
      if(fallback !== result) distractorPool.add(fallback);
      fallback++;
    }
    const options = shuffle([result, ...[...distractorPool].slice(0, cfg.choices-1)]);

    choicesGrid.style.gridTemplateColumns = 'repeat(' + Math.min(cfg.choices,4) + ',1fr)';
    choicesGrid.innerHTML = '';
    options.forEach((num, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = num;
      btn.style.background = `linear-gradient(155deg, ${CHOICE_COLORS[i % CHOICE_COLORS.length]}, ${CHOICE_COLORS_DARK[i % CHOICE_COLORS_DARK.length]})`;
      btn.onclick = () => onChoose(num, result, btn);
      choicesGrid.appendChild(btn);
    });

    updateStats();
  }

  function onChoose(num, result, btn){
    if(state.locked) return;
    state.moves++;
    updateStats();
    if(num === result){
      state.locked = true;
      btn.classList.add('correct');
      const slot = document.getElementById('answerSlot');
      slot.textContent = result;
      slot.classList.add('revealed');
      sfxCorrect();
      showPraise();
      state.correctCount++;
      updateStats();
      setTimeout(() => {
        state.roundIdx++;
        if(state.roundIdx >= state.totalRounds){
          showFinish();
        } else {
          buildRound();
        }
      }, 1100);
    } else {
      btn.classList.add('wrong');
      sfxWrong();
      setTimeout(() => btn.classList.remove('wrong'), 420);
    }
  }

  function showPraise(){
    const el = document.createElement('div');
    el.className = 'praise-float show';
    el.textContent = PRAISE[Math.floor(Math.random()*PRAISE.length)] + ' 🎉';
    gameScreen.appendChild(el);
    setTimeout(()=>el.remove(), 950);
  }

  function showFinish(){
    sfxFinish();
    gameScreen.style.display = 'none';
    finishScreen.style.display = 'flex';
    document.getElementById('finalMoves').textContent = state.moves;

    state.doneLevels.add(state.levelKey);
    const curIdx = LEVEL_ORDER.indexOf(state.levelKey);
    const nextKey = LEVEL_ORDER[curIdx+1];
    const nextBtn = document.getElementById('nextLevelBtn');
    const kicker = document.getElementById('finishKicker');
    const title = document.getElementById('finishTitle');

    if(nextKey){
      kicker.textContent = 'Level ' + LEVELS[state.levelKey].label + ' Selesai!';
      title.textContent = '🎉 Semua soal selesai!';
      nextBtn.hidden = false;
      nextBtn.textContent = 'Lanjut ke Level ' + LEVELS[nextKey].label + ' ➡️';
      nextBtn.onclick = () => { sfxClick(); state.levelKey = nextKey; startGame(); };
    } else {
      kicker.textContent = 'Semua Level Selesai!';
      title.textContent = '🏆 Kamu Jago Berhitung!';
      nextBtn.hidden = true;
    }
  }

  function startGame(){
    ensureAudio();
    const cfg = LEVELS[state.levelKey];
    state.totalRounds = cfg.rounds;
    state.roundIdx = 0;
    state.correctCount = 0;
    state.moves = 0;
    menuScreen.style.display = 'none';
    finishScreen.style.display = 'none';
    gameScreen.style.display = 'flex';
    buildRound();
  }
  function backToMenu(){
    gameScreen.style.display = 'none';
    finishScreen.style.display = 'none';
    menuScreen.style.display = 'flex';
    buildLevelGrid();
  }

  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('backBtn').onclick = () => { sfxClick(); backToMenu(); };
  document.getElementById('restartBtn').onclick = () => { sfxClick(); startGame(); };
  document.getElementById('menuBtn2').onclick = () => { sfxClick(); backToMenu(); };
})();
</script>
</body>
</html>
